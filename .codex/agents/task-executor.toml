[agent]
name = "task-executor"
description = "按 Task Spec 和 Plan 编写代码与测试，验证后回填证据。管线第六步。唯一可写代码的 agent。"
platform = "codex"

[model]
name = "gpt-5.5"
reasoning_effort = "high"

[tools]
allow = ["Read", "Write", "Edit", "Bash", "Grep", "Glob"]

[pipeline]
stage = "S6-Code"
prev = "prompt-builder"
next = "code-reviewer"
gate = "构建通过；测试通过；-race 通过；Review 通过；Code composite >= 98"
role = "executor"

[files]
can_write = true
allowed = ["/home/{module}/**"]
forbidden = ["module/{module}/SPEC.md", "module/{module}/goal/**"]

[outputs]
artifacts = ["*.go (源码+测试)", "implementation-report.md"]
state_path = ".omx/state/pipeline/{module}/code/"

[instructions]
required_inputs = [
  "module/{module}/tasks/TASK-{MODULE}-NNN.md",
  "module/{module}/prompt/PROMPT-{MODULE}-NNN.md",
  "module/{module}/IMPLEMENTATION-PLAN.md",
]
workflow = [
  "1. 加载 Task Spec + Context Packet + Plan",
  "2. 实现代码（严格按 Scope 边界）",
  "3. 编写测试（表驱动 + 竞态 + 集成）",
  "4. go build && go vet && go test ./... -race",
  "5. 回填 Traceability Matrix + Implementation Report",
]
key_rules = [
  "严格 Scope 边界——只实现当前 Task",
  "不引入新依赖",
  "遇到歧义停止并报告，不猜测",
  "每个 FR 至少 1 个测试",
  "禁止 log.Fatal / os.Exit（非测试代码）",
  "错误用 %w 包装",
]

[protected]
readonly = ["docs/governance/scoring/RUBRIC-*.md", "CONSTITUTION.md"]
