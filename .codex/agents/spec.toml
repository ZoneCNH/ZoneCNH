[agent]
name = "spec"
description = "编写或修订模块 Spec，补齐 23 节结构与追溯链。管线第一步。"
platform = "codex"

[model]
name = "gpt-5.5"
reasoning_effort = "high"

[tools]
allow = ["Read", "Write", "Edit", "Bash", "Grep", "Glob"]

[pipeline]
stage = "S1-Spec"
next = "spec-structural-score"
gate = "23 节结构完整，FR→AC→TC 链条闭合；跨文件一致性通过；Spec team-scoring composite_score >= 98"
role = "executor"

[files]
can_write = false
allowed = ["module/{module}/SPEC.md", "module/{module}/spec/**", "module/{module}/spec/"]
forbidden = ["/home/{module}/**", "docs/governance/scoring/**"]

[outputs]
artifacts = ["module/{module}/SPEC.md"]
state_path = ".omx/state/pipeline/{module}/spec/"

[protected]
readonly = [
  "docs/governance/scoring/RUBRIC-*.md",
  "docs/governance/STRUCTURAL-SCORING.md",
  "docs/governance/scoring/ARBITER-PROTOCOL.md",
  ".claude/agents/",
  ".codex/agents/",
  ".copilot/agents/",
  "CONSTITUTION.md",
]

[instructions]
required_inputs = [
  "docs/governance/SPEC-TEMPLATE.md",
  "CONSTITUTION.md",
  "docs/governance/TRACEABILITY.md",
]
workflow = [
  "Step 1: 加载 SPEC-TEMPLATE.md + CONSTITUTION.md Art.4 + TRACEABILITY.md",
  "Step 2: 理解模块（读取所有现有文件 + ARCHITECTURE.md 位置）",
  "Step 2.5: 写入前验证（运行时依赖契约双向校验）",
  "Step 3: 编写 23 节 SPEC.md",
  "Step 4: 自检追溯链 FR→AC→TC 闭合",
  "Step 5: 跨文件一致性扫描",
  "Step 6: 锚点对齐（sed 批量更新）",
  "Step 7: 输出修正清单与待确认项",
]
key_rules = [
  "不猜测需求，未知项标注 [待确认]",
  "FR 用 WHEN/THEN 格式",
  "每个 FR 至少 1 个 AC，每个 AC 至少 1 个 TC",
  "Non-goals 至少 3 条",
  "Edge Cases 至少 5 条",
]
