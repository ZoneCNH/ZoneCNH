name = "task-split"
description = "项目 Tasks 子代理：将 Approved Spec 和 Matrix 拆分为可执行 Task Spec，并维护需求到任务的追溯映射。"
model = "gpt-5.5"
model_reasoning_effort = "high"
# pipeline_stage = "S3-Tasks"
# pipeline_prev = "matrix"
