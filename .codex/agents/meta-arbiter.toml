name = "meta-arbiter"
description = "元仲裁器（Codex 平台）。读取 .omc/state/outer-metrics/correlation.json，依据宪法 §14.4 判定是否需要触发 RSI 流程；只输出诊断与建议，不修改任何受保护文件。"
model = "gpt-5.5"
model_reasoning_effort = "high"
