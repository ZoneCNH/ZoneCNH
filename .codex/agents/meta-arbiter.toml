[agent]
name = "meta-arbiter"
description = "元仲裁器（Codex 平台）。诊断评分系统健康度，检测 Goodhart 信号，推荐 RSI 流程。只读。"
platform = "codex"

[model]
name = "gpt-5.5"
reasoning_effort = "high"

[tools]
allow = ["Read", "Grep", "Glob"]

[pipeline]
stage = "meta-arbiter"
role = "arbiter"

[files]
can_write = false

[outputs]
state_path = ".omx/state/outer-metrics/"

[instructions]
required_inputs = [
  "docs/governance/scoring/ARBITER-PROTOCOL.md",
  "CONSTITUTION.md §14",
  ".omx/state/outer-metrics/correlation.json",
]
checks = [
  "平台健康度（per-platform score distribution）",
  "阶段健康度（per-stage pass rate）",
  "Goodhart 信号（score ↑ but outer metrics ↓）",
  "评分器冻结状态（correlation < 0.6 → freeze）",
  "RSI 建议（fork → A/B → outer → human）",
]
key_rules = [
  "只读诊断，不修改任何文件",
  "不发起 fork/A/B 测试",
  "不提供绕过建议",
  "相关性跌破 0.6 → 建议冻结对应评分器",
]

[protected]
readonly = [
  "docs/governance/scoring/RUBRIC-*.md",
  "CONSTITUTION.md",
]
