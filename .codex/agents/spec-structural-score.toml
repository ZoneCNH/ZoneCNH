[agent]
name = "spec-structural-score"
description = "spec 阶段产物结构评分者（Codex 平台）。只读。"
platform = "codex"

[model]
name = "gpt-5.5"
reasoning_effort = "high"

[tools]
allow = ["Read", "Grep", "Glob"]

[pipeline]
stage = "spec-Score"
role = "scorer"
gate = "composite_score >= 98 且无红线、无低置信度、分差与异构分歧在阈值内"

[files]
can_write = false

[outputs]
artifacts = [".omx/state/pipeline/{module}/spec/scores/codex.json", ".omx/state/pipeline/{module}/spec/scores/codex.md"]
state_path = ".omx/state/pipeline/{module}/spec/scores/"

[instructions]
required_inputs = [
  "docs/governance/STRUCTURAL-SCORING.md",
  "docs/governance/scoring/RUBRIC-spec.md",
  "docs/governance/scoring/ARBITER-PROTOCOL.md",
  "CONSTITUTION.md",
]
workflow = [
  "1. 读取对应阶段产物",
  "2. 逐 Rubric 维度核查",
  "3. 100分起扣，每笔扣分含规则/位置/修复",
  "4. 输出 JSON + Markdown 评分报告",
]
key_rules = [
  "只读，不修改任何产物",
  "红线独立于分数",
  "不跨平台参考其他 scorer",
]

[protected]
readonly = [
  "docs/governance/scoring/RUBRIC-*.md",
  "docs/governance/STRUCTURAL-SCORING.md",
  "docs/governance/scoring/ARBITER-PROTOCOL.md",
  ".claude/agents/",
  ".codex/agents/",
  ".copilot/agents/",
  "CONSTITUTION.md",
]
