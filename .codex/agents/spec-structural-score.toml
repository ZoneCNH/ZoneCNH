name = "spec-structural-score"
description = "项目 Spec 结构评分子代理：只读扫描 module/*/SPEC.md 的结构性问题、追溯断点、治理红线和 Ready 风险，输出四源评分输入、扣分账本与修复优先级；Spec gate 由 pipeline-arbiter 的 composite_score 判定。"
model = "gpt-5.5"
