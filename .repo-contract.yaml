schema_version: foundation.repo-contract/v1
contract_version: v0.5.2-foundation-v2
updated: '2026-06-15'
repo:
  name: ZoneCNH
  path: github.com/ZoneCNH/ZoneCNH
  role: foundation-index
foundation:
  name: Foundation v2
  module_count: 20  # 仅基座模块（FOUNDATION-DEPS.yaml modules 段 layer≠L2.5 的模块数）；不含 domainx(L2.5) 与业务域模块
  go_baseline: '1.23'
  deps_matrix: module/FOUNDATION-DEPS.yaml
  current_sources:
  - module/README.md
  - module/*/SPEC.md
  - module/FOUNDATION-DEPS.yaml
  - .foundationx/repo-contract.json
  historical_sources:
  - module/FOUNDATION-SPEC.md
  - module/FOUNDATION-V1.md
  - module/foundation-modules.md
xlib_roles:
  xlib_standard: standards, schemas, templates, and reference facts only
  xlib_harness: generator, scaffold, spec-lint, boundary, traceability, format, and
    template gate runner
  xlib_evidence: CI/release evidence manifest and report runtime
  xlibgate: machine policy gate for repo-contract, imports, go.mod, baseline, secrets,
    release evidence, and maturity claims
exit_codes:
  pass: 0
  policy_failure: 1
  tool_error: 2
reason_codes:
  policy_failures:
  - policy_import_violation
  - policy_gomod_drift
  - policy_baseline_mismatch
  - policy_secret_scan_failure
  - policy_release_evidence_missing
  - policy_contract_projection_drift
  - policy_repo_identity_mismatch
  - policy_template_residue
  - policy_maturity_claim_overreach
  - policy_status_summary_drift
  - policy_blocker_index_drift
  - policy_open_blocker_factory_gate
  - policy_release_factory_inconsistent
  - policy_projection_overstates_fact_layer
  tool_errors:
  - tool_config_missing
  - tool_config_invalid
  - tool_evidence_parse_error
  - tool_external_command_error
  - tool_missing_dependency
  - tool_io_error
  - tool_unknown_error
maturity_dimensions:
- spec
- implementation
- release
- live_integration
- external_ci
- downstream_adoption
- production_soak
- factory_gate
projection_guards:
  public_docs:
  - README.md
  - ARCHITECTURE.md
  - STATUS.md
  - module/README.md
  release_manifest: release/manifest/latest.json
  fact_sources:
  - .foundationx/status/index.json
  - .foundationx/blockers.json
  audit_scripts:
  - scripts/audit-status.py
  - .github/ci/status-consistency-check.sh
  rules:
  - public projections must not overstate .foundationx/status/index.json
  - generated claims must fail CI when fact-layer invariants fail
trust_hardening:
  ruleset: v1.1.2
  status_source: .foundationx/status/index.json
  blocker_source: .foundationx/blockers.json
  policy_rules:
  - summary counts are derived from module entries
  - release=false forces factory=false
  - open blocker forces factory=false for that module
  - open release blocker forces release=false for that module
  - public projections must not overstate the fact layer
claim_model:
  purpose: projection consistency guard only; not factory-grade proof
  required_inputs:
  - .foundationx/status/index.json
  - .foundationx/blockers.json
  - .foundationx/repo-contract.json
  - release/trust/index.json
  invariants:
  - release_manifest must point at release/manifest/latest.json
  - public_docs must stay bounded to public release docs
  - factory-grade claims require open blocker review and trust evidence
  factory_grade_requires:
  - foundation status summary
  - open blocker review
  - projection guard
  - xlibgate trust evidence
maturity_state_model:
  purpose: separates pipeline completion, release evidence, adoption, and factory-grade claims
  states:
  - spec
  - implementation
  - release
  - live_integration
  - external_ci
  - downstream_adoption
  - production_soak
  - factory_gate
  claim_rules:
  - spec or implementation completion does not imply release
  - release evidence does not imply factory-grade
  - open blockers force factory_gate=false for affected modules
  - public aggregate maturity must be derived from fact sources, not manual tables
api_freeze_governance:
  purpose: records API freeze as a governed claim rather than a readiness shortcut
  status: policy_defined_pending_gate_artifact
  applies_to:
  - kernel
  - configx
  - observex
  - resiliencx
  - schedulex
  required_before_factory_grade: true
  required_evidence:
  - api freeze decision record
  - compatibility or downstream smoke evidence
  - xlibgate api-freeze-check result
  invariants:
  - api freeze recommendations are not release or factory-grade evidence
  - factory-grade projection must fail when required freeze evidence is absent
identity_guards:
  purpose: prevents template, repo identity, and release evidence drift from becoming public claims
  canonical_xlibgate_gates:
  - trust identity
  - trust template-residue
  - trust release-consistency
  blocking_conditions:
  - repo identity mismatch
  - template residue in shipped metadata
  - release manifest or trust index inconsistency
  public_projection_rules:
  - identity and template checks must pass before publishing aggregate trust claims
  - release consistency must pass before publishing release-backed maturity claims
