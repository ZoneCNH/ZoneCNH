name: Foundation Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      modules:
        description: "Modules to release (comma-separated, or 'all')"
        required: true
        type: string
        default: "all"

permissions:
  contents: write

jobs:
  # ── 0. CICD-001 门禁 ───────────────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  quality-gate:
    needs: runner-gate
    uses: ./.github/workflows/docs-ci.yml

  release-prep:
    name: Release Pre-flight
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch'
    outputs:
      release_matrix: ${{ steps.release-matrix.outputs.release_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          FOUNDATION_RELEASE_TOKEN: ${{ secrets.FOUNDATION_RELEASE_TOKEN }}
          RELEASE_MODULES: ${{ inputs.modules }}
        run: |
          if [ -z "$FOUNDATION_RELEASE_TOKEN" ]; then
            echo "ERROR: FOUNDATION_RELEASE_TOKEN secret is required for cross-repository release tagging."
            exit 1
          fi

          if [ -z "$(printf '%s' "$RELEASE_MODULES" | tr -d '[:space:]')" ]; then
            echo "ERROR: No Foundation modules selected."
            exit 1
          fi
      - name: Validate FOUNDATION-DEPS.yaml pre-release
        run: |
          python3 -c "
          import yaml
          with open('module/FOUNDATION-DEPS.yaml') as f:
              matrix = yaml.safe_load(f)
          print(f'Go baseline: {matrix[\"go_baseline\"]}')
          print(f'Modules: {len(matrix[\"modules\"])}')
          print(f'Allowed dependency entries: {len(matrix[\"allowed_deps\"])}')
          print('Pre-flight OK')
          "
      - name: Resolve release repositories from registry
        id: release-matrix
        env:
          RELEASE_MODULES: ${{ inputs.modules }}
        run: |
          python3 <<'PYEOF'
          import json
          import os

          import yaml

          with open("module/FOUNDATION-DEPS.yaml", encoding="utf-8") as deps_file:
              deps = yaml.safe_load(deps_file)
          release_modules = list(deps.get("modules", {}))
          if not release_modules:
              raise SystemExit("ERROR: FOUNDATION-DEPS release module set is empty")

          requested = os.environ["RELEASE_MODULES"]
          if requested == "all":
              selected = set(release_modules)
          else:
              selected = {
                  item.strip()
                  for item in requested.split(",")
                  if item.strip()
              }

          unknown_modules = selected.difference(release_modules)
          if unknown_modules:
              raise SystemExit(
                  "ERROR: Unknown Foundation module(s): "
                  + ", ".join(sorted(unknown_modules))
              )

          with open("module/registry.yaml", encoding="utf-8") as registry_file:
              registry = yaml.safe_load(registry_file)

          release_matrix = []
          for module in release_modules:
              if module not in selected:
                  continue
              entry = registry.get(module, {})
              repo_target = entry.get("repo") if isinstance(entry, dict) else None
              expected_suffix = f"/{module}"
              if (
                  not isinstance(repo_target, str)
                  or not repo_target.startswith("github.com/")
                  or not repo_target.endswith(expected_suffix)
                  or repo_target.count("/") != 2
              ):
                  raise SystemExit(
                      f"ERROR: invalid registry.repo for {module}: {repo_target!r}"
                  )
              release_matrix.append({
                  "module": module,
                  "repository": repo_target.removeprefix("github.com/"),
              })

          if not release_matrix:
              raise SystemExit("ERROR: release repository matrix is empty")

          output = json.dumps(release_matrix, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"release_matrix={output}\n")
          PYEOF

  release-modules:
    name: Release ${{ matrix.module }}
    needs: release-prep
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-prep.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.FOUNDATION_RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Tag and push ${{ matrix.module }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "ERROR: tag ${{ inputs.release_version }} already exists in ${{ matrix.module }}"
            exit 1
          fi
          git tag -a "${{ inputs.release_version }}" -m "Foundation release ${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"

  aggregate-manifest:
    name: Aggregate Release Manifest
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    needs: [release-prep, release-modules]
    if: needs.release-modules.result == 'success' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Generate aggregated foundation release manifest
        env:
          RELEASE_MATRIX: ${{ needs.release-prep.outputs.release_matrix }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          release_matrix = json.loads(os.environ["RELEASE_MATRIX"])
          selected_modules = [entry["module"] for entry in release_matrix]
          gate_module_set = {
              "xlib_standard",
              "xlib_harness",
              "xlib_evidence",
              "xlibgate",
          }
          with open("module/FOUNDATION-DEPS.yaml", encoding="utf-8") as deps_file:
              deps = yaml.safe_load(deps_file)
          manifest = {
              "version": os.environ["RELEASE_VERSION"],
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "go_baseline": deps["go_baseline"],
              "modules": selected_modules,
              "gate_modules": [
                  module for module in selected_modules if module in gate_module_set
              ],
              "trust_contract": ".foundationx/repo-contract.json",
          }
          output = Path("release/foundation") / f"release-{os.environ['RELEASE_VERSION']}.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PYEOF
      - name: Commit and push manifest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # actions/checkout 在 push/event 下处于 detached HEAD；切回目标分支以使 push 生效。
          git checkout -B "$GITHUB_REF_NAME"
          git add release/foundation/
          if ! git diff --cached --quiet; then
            cat > /tmp/foundation-release-commit-message.txt << MSG
          Record foundation release manifest

          Constraint: Foundation release workflow writes release/foundation manifests from the homepage repository.
          Rejected: One-line generated commit | repository commit protocol requires audit trailers.
          Confidence: medium
          Scope-risk: narrow
          Directive: Keep release automation commits compliant with the Lore protocol.
          Tested: Foundation release workflow reached manifest aggregation.
          Not-tested: Manual inspection before generated workflow commit.
          Co-authored-by: OmX <omx@oh-my-codex.dev>
          MSG
            git commit -F /tmp/foundation-release-commit-message.txt
            git push origin "$GITHUB_REF_NAME"
          fi
