name: Foundation Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      modules:
        description: "Modules to release (comma-separated, or 'all')"
        required: true
        type: string
        default: "all"

permissions:
  contents: write

jobs:
  # ── 0. CICD-001 门禁 ───────────────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  quality-gate:
    needs: runner-gate
    uses: ./.github/workflows/docs-ci.yml

  release-prep:
    name: Release Pre-flight
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 10
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          FOUNDATION_RELEASE_TOKEN: ${{ secrets.FOUNDATION_RELEASE_TOKEN }}
          RELEASE_MODULES: ${{ inputs.modules }}
        run: |
          if [ -z "$FOUNDATION_RELEASE_TOKEN" ]; then
            echo "ERROR: FOUNDATION_RELEASE_TOKEN secret is required for cross-repository release tagging."
            exit 1
          fi

          if [ "$RELEASE_MODULES" != "all" ]; then
            selected_count=0
            IFS=',' read -ra modules <<< "$RELEASE_MODULES"
            for raw_module in "${modules[@]}"; do
              module="$(printf '%s' "$raw_module" | tr -d '[:space:]')"
              case "$module" in
                kernel|configx|observex|resiliencx|schedulex|testkitx|xlib_standard|xlib_harness|xlib_evidence|xlibgate|redisx|kafkax|natsx|postgresx|taosx|ossx|clickhousex|contracts|transportx|domainx)
                  selected_count=$((selected_count + 1))
                  ;;
                "")
                  ;;
                *)
                  echo "ERROR: Unknown Foundation module '$module'"
                  exit 1
                  ;;
              esac
            done

            if [ "$selected_count" -eq 0 ]; then
              echo "ERROR: No Foundation modules selected."
              exit 1
            fi
          fi
      - name: Validate FOUNDATION-DEPS.yaml pre-release
        run: |
          python3 -c "
          import yaml
          with open('module/FOUNDATION-DEPS.yaml') as f:
              matrix = yaml.safe_load(f)
          print(f'Go baseline: {matrix[\"go_baseline\"]}')
          print(f'Modules: {len(matrix[\"modules\"])}')
          print(f'Allowed dependency entries: {len(matrix[\"allowed_deps\"])}')
          print('Pre-flight OK')
          "

  release-modules:
    name: Release ${{ matrix.module }}
    needs: release-prep
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        module:
          - kernel
          - configx
          - observex
          - resiliencx
          - schedulex
          - testkitx
          - xlib_standard
          - xlib_harness
          - xlib_evidence
          - xlibgate
          - redisx
          - kafkax
          - natsx
          - postgresx
          - taosx
          - ossx
          - clickhousex
          - contracts
          - transportx
          - domainx
    steps:
      - name: Check module selection
        id: selection
        run: |
          if [ "${{ inputs.modules }}" = "all" ]; then
            echo "release_module=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_module=false
          IFS=',' read -ra selected <<< "${{ inputs.modules }}"
          for raw_module in "${selected[@]}"; do
            module="$(printf '%s' "$raw_module" | tr -d '[:space:]')"
            if [ "$module" = "${{ matrix.module }}" ]; then
              release_module=true
              break
            fi
          done
          echo "release_module=$release_module" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.selection.outputs.release_module == 'true'
        with:
          repository: ZoneCNH/${{ matrix.module }}
          token: ${{ secrets.FOUNDATION_RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Tag and push ${{ matrix.module }}
        if: steps.selection.outputs.release_module == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "ERROR: tag ${{ inputs.release_version }} already exists in ${{ matrix.module }}"
            exit 1
          fi
          git tag -a "${{ inputs.release_version }}" -m "Foundation release ${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"

  aggregate-manifest:
    name: Aggregate Release Manifest
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 10
    needs: release-modules
    if: always() && needs.release-modules.result != 'failure' && needs.release-modules.result != 'cancelled' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Generate aggregated foundation release manifest
        run: |
          mkdir -p release/foundation
          cat > release/foundation/release-${{ inputs.release_version }}.json << EOF
          {
            "version": "${{ inputs.release_version }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "go_baseline": "1.23",
            "modules": [
              "kernel",
              "configx",
              "observex",
              "resiliencx",
              "schedulex",
              "testkitx",
              "xlib_standard",
              "xlib_harness",
              "xlib_evidence",
              "xlibgate",
              "redisx",
              "kafkax",
              "natsx",
              "postgresx",
              "taosx",
              "ossx",
              "clickhousex",
              "contracts",
              "transportx",
              "domainx"
            ],
            "gate_modules": [
              "xlib_standard",
              "xlib_harness",
              "xlib_evidence",
              "xlibgate"
            ],
            "trust_contract": ".foundationx/repo-contract.json"
          }
          EOF
      - name: Commit and push manifest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # actions/checkout 在 push/event 下处于 detached HEAD；切回目标分支以使 push 生效。
          git checkout -B "$GITHUB_REF_NAME"
          git add release/foundation/
          if ! git diff --cached --quiet; then
            cat > /tmp/foundation-release-commit-message.txt << MSG
          Record foundation release manifest

          Constraint: Foundation release workflow writes release/foundation manifests from the homepage repository.
          Rejected: One-line generated commit | repository commit protocol requires audit trailers.
          Confidence: medium
          Scope-risk: narrow
          Directive: Keep release automation commits compliant with the Lore protocol.
          Tested: Foundation release workflow reached manifest aggregation.
          Not-tested: Manual inspection before generated workflow commit.
          Co-authored-by: OmX <omx@oh-my-codex.dev>
          MSG
            git commit -F /tmp/foundation-release-commit-message.txt
            git push origin "$GITHUB_REF_NAME"
          fi
