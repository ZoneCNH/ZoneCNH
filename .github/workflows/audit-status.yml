name: Audit STATUS.md consistency

# Self-hosted runner decommissioned 2026-06-18. Migrated to ubuntu-latest.
# schedule: 每日 06:00 UTC 定时刷新 audit，检测投影层与事实层漂移（P1-1，2026-06-25）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FoundationX JSON files
        run: |
          python3 -m json.tool .foundationx/status/index.json >/dev/null
          python3 -m json.tool .foundationx/blockers.json >/dev/null
          python3 -m json.tool .foundationx/repo-contract.json >/dev/null
          python3 -m json.tool .foundationx/repo-contract.schema.json >/dev/null
      - name: Validate audit guard syntax
        run: |
          python3 -m py_compile scripts/audit-status.py
          bash -n .github/ci/status-consistency-check.sh
      - name: Run audit regression tests
        run: |
          pip install pytest
          python3 -m pytest scripts/tests -q
      - name: Run cross-document consistency check
        run: |
          python3 scripts/audit-status.py
          python3 scripts/audit-status.py --foundationx-only
          bash .github/ci/status-consistency-check.sh
