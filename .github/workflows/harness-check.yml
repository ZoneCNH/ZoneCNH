name: Harness Check
on: [push, pull_request]

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, homepage]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run harness health check
        run: node scripts/check.mjs
