name: Harness Check
# Self-hosted runner recovered 2026-07-09 (knowledge/ci.md Phase 0). Migrated to sre/foundation-l0.
# Restored push/pull_request triggers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Binance docs drift check
        run: bash scripts/check-binance-docs.sh
      - name: Run harness health check
        run: node scripts/check.mjs
