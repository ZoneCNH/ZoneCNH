name: Harness Check
# Self-hosted runner decommissioned 2026-06-18. Migrated to ubuntu-latest.
# Restored push/pull_request triggers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Binance docs drift check
        run: bash scripts/check-binance-docs.sh
      - name: Run harness health check
        run: node scripts/check.mjs
