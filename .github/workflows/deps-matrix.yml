name: Foundation Dependency Matrix

# Self-hosted runner recovered 2026-07-09 (knowledge/ci.md Phase 0). Migrated to sre/governance.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 0. CICD-001 门禁 ───────────────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  yaml-lint:
    needs: runner-gate
    name: Validate YAML
    runs-on: [self-hosted, Linux, X64, sre/governance]
    steps:
      - uses: actions/checkout@v4
      - name: Validate FOUNDATION-DEPS.yaml
        run: |
          python3 -c "
          import yaml, sys
          with open('module/FOUNDATION-DEPS.yaml') as f:
              data = yaml.safe_load(f)
          required = ['version', 'modules', 'allowed_deps', 'forbidden_deps']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'ERROR: Missing required fields: {missing}')
              sys.exit(1)
          print(f'OK: version={data[\"version\"]}, modules={len(data[\"modules\"])}')
          "

  deps-check:
    name: Check Dependencies
    runs-on: [self-hosted, Linux, X64, sre/governance]
    needs: yaml-lint
    outputs:
      violations: ${{ steps.check.outputs.violations }}
      has_violations: ${{ steps.check.outputs.has_violations }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # self-hosted runner（用户非 runner）上 /home/runner/go 不可写，
          # setup-go v5 默认 cache:true 会 mkdir /home/runner/go 触发 EACCES。
          # 本 job 仅用 go list -m 读 go.mod，无需模块缓存，禁用 cache。
          cache: false

      # GOPATH/GOCACHE 指向 RUNNER_TEMP（self-hosted runner 保证可写），
      # 避免 go list -m all 运行时回退到 /home/runner/go/pkg/mod 再次 EACCES
      - name: Configure Go paths for self-hosted runner
        run: |
          mkdir -p "$RUNNER_TEMP/go/pkg/mod" "$RUNNER_TEMP/go-cache"
          echo "GOPATH=$RUNNER_TEMP/go" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/go-cache" >> "$GITHUB_ENV"

      - name: Check dependency matrix
        id: check
        run: |
          python3 << 'PYEOF'
          import yaml, subprocess, json, os, sys

          with open("module/FOUNDATION-DEPS.yaml") as f:
              matrix = yaml.safe_load(f)

          with open("module/registry.yaml") as f:
              registry = yaml.safe_load(f)

          go_baseline = matrix.get("go_baseline", "1.23")
          modules = matrix.get("modules", {})
          allowed = matrix.get("allowed_deps", {})
          forbidden = matrix.get("forbidden_deps", [])
          # Hosting identity comes from registry.repo. Go module identity stays in
          # FOUNDATION-DEPS modules.*.path and is intentionally not rewritten by
          # a GitHub repository transfer.
          module_by_path = {}
          for name, definition in modules.items():
              if not isinstance(definition, dict) or not definition.get("path"):
                  continue
              module_path = definition["path"]
              path_prefix, _, path_name = module_path.rpartition("/")
              # A repository transfer must not force a breaking Go import-path
              # migration. Keep canonical matrix paths authoritative while also
              # recognizing the legacy kebab-case identities still published by
              # several modules.
              for path_alias_name in {
                  path_name,
                  path_name.replace("_", "-"),
                  path_name.replace("-", "_"),
              }:
                  path_alias = f"{path_prefix}/{path_alias_name}"
                  existing = module_by_path.get(path_alias)
                  if existing is not None and existing != name:
                      raise RuntimeError(
                          f"Go module alias collision: {path_alias} maps to "
                          f"both {existing} and {name}"
                      )
                  module_by_path[path_alias] = name
          module_paths_longest_first = sorted(
              module_by_path,
              key=len,
              reverse=True,
          )

          def resolve_module(import_path):
              """Resolve a module path or package subpath to its matrix module."""
              for module_path in module_paths_longest_first:
                  if import_path == module_path or import_path.startswith(f"{module_path}/"):
                      return module_by_path[module_path]
              return None

          legacy_resolution_examples = {
              "github.com/ZoneCNH/xlib-standard/pkg/templatex": "xlib_standard",
              "github.com/ZoneCNH/domain-market/pkg/domain_market": "domain_market",
          }
          for legacy_path, expected_module in legacy_resolution_examples.items():
              resolved_module = resolve_module(legacy_path)
              if resolved_module != expected_module:
                  raise RuntimeError(
                      f"Legacy Go module resolution failed for {legacy_path}: "
                      f"got {resolved_module!r}, want {expected_module!r}"
                  )

          violations = []

          for mod_name, mod_def in modules.items():
              registry_entry = registry.get(mod_name, {})
              repo_target = registry_entry.get("repo") if isinstance(registry_entry, dict) else None
              if not isinstance(repo_target, str) or not repo_target.startswith("github.com/"):
                  violations.append({
                      "module": mod_name,
                      "type": "REPOSITORY_IDENTITY_MISSING",
                      "detail": "No valid registry.repo hosting target"
                  })
                  continue
              repo_url = f"https://{repo_target}.git"
              clone_dir = f"/tmp/check-{mod_name}"

              # Clone
              ret = subprocess.run(
                  ["git", "clone", "--depth=1", repo_url, clone_dir],
                  capture_output=True, text=True
              )
              if ret.returncode != 0:
                  # SKIP: cannot clone (private/inaccessible repo) — not a violation
                  print(f"  ⚠ [SKIP] {mod_name}: cannot clone (not a violation)")
                  continue

              gomod = os.path.join(clone_dir, "go.mod")
              if not os.path.exists(gomod):
                  # SKIP: module has no go.mod (e.g. doc-only or worktree-only repos) — not a violation
                  print(f"  ⚠ [SKIP] {mod_name}: go.mod not found (not a violation)")
                  continue

              # Read the actual Go module identity before dependency checks. This
              # identity may intentionally differ from the hosting repository.
              actual_module = ""
              with open(gomod) as f:
                  for line in f:
                      if line.startswith("module "):
                          actual_module = line.strip().split()[1]
                          break

              # Check Go version (semantic compare: 1.25 == 1.25.0; warning only, not blocking)
              def go_major_minor(v):
                  parts = v.split(".")
                  return ".".join(parts[:2]) if len(parts) >= 2 else v
              with open(gomod) as f:
                  for line in f:
                      if line.startswith("go "):
                          ver = line.strip().split()[1]
                          if go_major_minor(ver) != go_major_minor(go_baseline):
                              print(f"  ⚠ [GO_VERSION] {mod_name}: Declared {ver}, baseline {go_baseline} (warning, not blocking)")
                          break

              # Check stdlib-only
              if mod_def.get("stdlib_only"):
                  ret = subprocess.run(
                      ["go", "list", "-m", "all"],
                      cwd=clone_dir, capture_output=True, text=True
                  )
                  if ret.returncode == 0:
                      for dep_line in ret.stdout.strip().split("\n"):
                          dep = dep_line.split()[0] if dep_line.strip() else ""
                          dep_module = resolve_module(dep)
                          if dep and "/" in dep and dep_module is None:
                              pass  # stdlib packages have no /
                          elif dep and dep_module not in (None, mod_name) and dep != actual_module:
                              violations.append({
                                  "module": mod_name,
                                  "type": "STDLIB_VIOLATION",
                                  "detail": f"Third-party dep: {dep}"
                              })

              # Check allowed deps
              mod_allowed = set(allowed.get(mod_name, []))
              # Normalize: treat - and _ as equivalent (kebab-case go.mod vs snake_case DEPS)
              mod_allowed_norm = {a.replace('-', '_') for a in mod_allowed}
              if mod_allowed:
                  ret = subprocess.run(
                      ["go", "list", "-m", "all"],
                      cwd=clone_dir, capture_output=True, text=True
                  )
                  if ret.returncode == 0:
                      for dep_line in ret.stdout.strip().split("\n"):
                          dep = dep_line.split()[0] if dep_line.strip() else ""
                          dep_module = resolve_module(dep)
                          if dep_module is None:
                              continue
                          # Skip self (including a legacy/shared actual module path).
                          if dep == actual_module or dep_module == mod_name:
                              continue
                          # Normalize: - and _ are equivalent for comparison
                          if dep_module.replace('-', '_') not in mod_allowed_norm:
                              violations.append({
                                  "module": mod_name,
                                  "type": "UNAUTHORIZED_DEP",
                                  "detail": f"Depends on {dep_module} (not in allowed list)"
                              })

              # Check forbidden deps
              for forb in forbidden:
                  ret = subprocess.run(
                      ["grep", "-r", forb, gomod],
                      capture_output=True, text=True
                  )
                  if ret.returncode == 0:
                      violations.append({
                          "module": mod_name,
                          "type": "FORBIDDEN_DEP",
                          "detail": f"Forbidden dep found: {forb}"
                      })

          # Output
          has_v = len(violations) > 0
          print(f"violations={json.dumps(violations)}")
          print(f"has_violations={'true' if has_v else 'false'}")

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as gh:
              gh.write(f"violations={json.dumps(violations)}\n")
              gh.write(f"has_violations={'true' if has_v else 'false'}\n")

          if has_v:
              print(f"\n❌ {len(violations)} violation(s) found:")
              for v in violations:
                  print(f"  [{v['type']}] {v['module']}: {v['detail']}")
              sys.exit(1)
          else:
              print("\n✅ All dependency checks passed.")
          PYEOF

  pr-comment:
    name: PR Comment
    runs-on: [self-hosted, Linux, X64, sre/governance]
    needs: deps-check
    if: github.event_name == 'pull_request' && needs.deps-check.outputs.has_violations == 'true'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const violations = JSON.parse('${{ needs.deps-check.outputs.violations }}');
            let body = '## ❌ Foundation Dependency Matrix Violations\n\n';
            body += '| Module | Type | Detail |\n|--------|------|--------|\n';
            for (const v of violations) {
              body += `| ${v.module} | ${v.type} | ${v.detail} |\n`;
            }
            body += '\n**Fix**: Update go.mod to comply with [FOUNDATION-DEPS.yaml](../blob/main/module/FOUNDATION-DEPS.yaml).\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Foundation Dependency Matrix Violations'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  summary:
    name: Summary
    runs-on: [self-hosted, Linux, X64, sre/governance]
    needs: [deps-check]
    if: always()
    steps:
      - name: Write summary
        run: |
          if [ "${{ needs.deps-check.outputs.has_violations }}" = "true" ]; then
            echo "## ❌ Dependency Matrix: VIOLATIONS FOUND" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.deps-check.outputs.violations }}' | python3 -m json.tool >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Dependency Matrix: All Checks Passed" >> $GITHUB_STEP_SUMMARY
          fi
