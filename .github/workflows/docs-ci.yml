# 文档 CI — 纯 Markdown 仓库的质量守卫
#
# 触发条件：PR、push to main、每周一定时巡检
# 四项检查：markdownlint / link-check / grep-guard / status-consistency

name: Docs CI

on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**/*.md"
      - "module/**/*.md"
      - "specs/**/*.md"
      - ".github/workflows/*.yml"
      - ".github/ci/**"
      - ".markdownlint.json"
      - ".lycheeignore"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**/*.md"
      - "module/**/*.md"
      - "specs/**/*.md"
      - ".github/workflows/*.yml"
      - ".github/ci/**"
      - ".markdownlint.json"
      - ".lycheeignore"
  schedule:
    # 每周一 09:17 UTC（北京时间 17:17）巡检
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Markdown 格式规范 ──────────────────────────────────────
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md
            module/**/*.md
            specs/**/*.md
          config: .markdownlint.json

  # ── 2. 链接有效性检查 ────────────────────────────────────────
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查链接有效性（lychee）
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude '127\.0\.0\.1'
            --exclude 'localhost'
            --exclude '0\.0\.0\.0'
            --exclude 'file://'
            --accept 200,204,301,302,403,429
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --header 'Accept: text/html'
            --exclude-file .lycheeignore
            -- '*.md'
            'docs/**/*.md'
            'module/**/*.md'
            'specs/**/*.md'
          fail: true

  # ── 3. 敏感内容守卫 ──────────────────────────────────────────
  grep-guard:
    name: Grep Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 grep 守卫脚本
        run: bash .github/ci/grep-guard.sh

  # ── 4. 状态一致性校验 ────────────────────────────────────────
  status-consistency:
    name: Status Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行状态一致性检查
        run: bash .github/ci/status-consistency-check.sh

  # ── 5. Spec 结构校验 ────────────────────────────────────────
  spec-lint:
    name: Spec Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 spec 结构完整性
        run: bash .github/ci/spec-lint.sh

  # ── 5b. Spec 漂移防护 ──────────────────────────────────────
  spec-drift-guard:
    name: Spec Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测 SPEC.md 被外部篡改
        run: bash .github/ci/spec-drift-guard.sh

  # ── 6. 追踪矩阵校验 ────────────────────────────────────────
  traceability-check:
    name: Traceability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验追踪矩阵完整性
        run: bash .github/ci/traceability-check.sh

  # ── 7. Task Spec 校验 ────────────────────────────────────────
  task-spec-validate:
    name: Task Spec Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Task Spec 结构和一致性
        run: bash .github/ci/task-spec-validate.sh

  # ── 8. Spec 状态报告 ────────────────────────────────────────
  spec-status-report:
    name: Spec Status Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 spec 状态报告
        run: bash .github/ci/spec-status-report.sh

  # ── 9. 术语一致性检查 ──────────────────────────────────────
  glossary-consistency:
    name: Glossary Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查术语与 GLOSSARY.md 一致性
        run: bash .github/ci/glossary-consistency.sh

  # ── 10. 反需求扫描 ─────────────────────────────────────────
  anti-requirement-scan:
    name: Anti-Requirement Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 spec 代码片段违反反需求
        run: bash .github/ci/anti-requirement-scan.sh
