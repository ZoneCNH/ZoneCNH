# 文档 CI — 纯 Markdown 仓库的质量守卫
#
# 触发条件：PR、push to main、每周一定时巡检
# 检查项：markdownlint / link-check / grep-guard / workflow-policy / status-consistency / spec guards

name: Docs CI

# Self-hosted runner recovered 2026-07-09 (knowledge/ci.md Phase 0). Migrated to sre/governance.
# 仅保留 workflow_call/workflow_dispatch（被 release.yml 与 foundation-release.yml 引用）。
# Trigger 已恢复 2026-07-09（Phase 3）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Markdown 格式规范 ──────────────────────────────────────
  markdownlint:
    name: Markdownlint
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 运行 markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md
            module/**/*.md
            module/**/*.md
          config: .markdownlint.json

  # ── 2. 链接有效性检查 ────────────────────────────────────────
  link-check:
    name: Link Check
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # lychee-action@v2 在 self-hosted runner 上存在 PATH 传递 bug：
      # 其内置 install 把二进制放入 $RUNNER_TEMP/lychee/bin 并写入 $GITHUB_PATH，
      # 但 entrypoint 在后续 step 找不到 lychee（command not found, exit 127）。
      # 故在此预装 lychee 到 PATH 上、可写且跨 step 稳定的目录，绕过该 bug。
      # 注意：受控 runner 的 $HOME=/home/runner 为只读，原先装到
      # $HOME/.local/bin 会 mkdir Permission denied，导致 lychee 未能安装、
      # Link Check 在扫描前即 exit 1（与文档内容无关，纯属 CI 环境权限问题）。
      # 改为安装到 ${RUNNER_TEMP:-${TMPDIR:-/tmp}}/.local/bin（可写、跨 step 稳定）。
      - name: 预装 lychee（绕过 lychee-action@v2 的 self-hosted PATH bug）
        run: |
          set -euo pipefail
          if command -v lychee >/dev/null 2>&1; then
            echo "lychee 已存在于 PATH: $(command -v lychee)"
          else
            LYCHEE_BIN_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/.local/bin"
            mkdir -p "$LYCHEE_BIN_DIR"
            LYCHEE_VERSION="lychee-v0.24.2"
            tmpdir="$(mktemp -d)"
            curl -sfL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz -C "$tmpdir"
            install -D -m 0755 "${tmpdir}/lychee-x86_64-unknown-linux-gnu/lychee" "$LYCHEE_BIN_DIR/lychee"
            rm -rf "$tmpdir"
            echo "$LYCHEE_BIN_DIR" >> "$GITHUB_PATH"
            echo "已安装 lychee $LYCHEE_VERSION 到 $LYCHEE_BIN_DIR"
          fi
          lychee --version
        shell: bash

      - name: 检查链接有效性（lychee）
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude '127\.0\.0\.1'
            --exclude 'localhost'
            --exclude '0\.0\.0\.0'
            --exclude 'file://'
            --exclude 'github\.com/ZoneCNH/'
            --accept 200,204,301,302,403,406,429
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --header 'Accept: text/html'
            --exclude-file .lycheeignore
            -- '*.md'
            'docs/**/*.md'
            'module/**/*.md'
            'module/**/*.md'
          fail: true

  # ── 3. 敏感内容守卫 ──────────────────────────────────────────
  grep-guard:
    name: Grep Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 运行 grep 守卫脚本
        run: bash .github/ci/grep-guard.sh

  # ── 4. Workflow 策略守卫 ──────────────────────────────────────
  workflow-policy-guard:
    name: Workflow Policy Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验全局 CI/CD workflow 策略
        run: bash .github/ci/workflow-policy-guard.sh

  # ── 4b. 模块 CI/CD 契约守卫 ─────────────────────────────────
  module-cicd-contract:
    name: Module CI/CD Contract
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验模块 CI/CD workflow 使用 sre/ 机器池
        run: bash .github/ci/module-cicd-check.sh

  # ── 5. 状态一致性校验 ────────────────────────────────────────
  status-consistency:
    name: Status Consistency
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 运行状态一致性检查
        run: |
          bash .github/ci/status-consistency-check.sh
          bash .github/ci/binance-status-consistency-check.sh

  # ── 6. Spec 结构校验 ────────────────────────────────────────
  spec-lint:
    name: Spec Lint
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 校验 spec 结构完整性
        run: bash .github/ci/spec-lint.sh

  # ── 6c. 模块注册表校验 ─────────────────────────────────────
  registry-lint:
    name: Registry Lint
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 测试 registry repo 身份校验
        run: bash .github/ci/registry-lint-test.sh

      - name: 校验 module/registry.yaml 完整性
        run: bash .github/ci/registry-lint.sh

  # ── 6b. Spec 漂移防护 ──────────────────────────────────────
  spec-drift-guard:
    name: Spec Drift Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检测 SPEC.md 被外部篡改
        run: bash .github/ci/spec-drift-guard.sh

  # ── 7. 追踪矩阵校验 ────────────────────────────────────────
  traceability-check:
    name: Traceability Check
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验追踪矩阵完整性
        run: bash .github/ci/traceability-check.sh

  # ── 8. Task Spec 校验 ────────────────────────────────────────
  task-spec-validate:
    name: Task Spec Validate
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Task Spec 结构和一致性
        run: bash .github/ci/task-spec-validate.sh

  # ── 9. Binance 文档治理校验 ────────────────────────────────
  binance-docs-check:
    name: Binance Docs Check
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验 binance 文档治理规则
        run: bash scripts/check-binance-docs.sh

  # ── 9b. 版本漂移检测 ────────────────────────────────────────
  version-drift-guard:
    name: Version Consistency Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检测 Runtime-Version / Spec-Version 一致性（binance）
        run: bash .github/ci/binance-version-consistency-check.sh

  # ── 9c. SPEC/TRACEABILITY 引用完整性 ──────────────────────
  spec-traceability-reference-guard:
    name: SPEC/TRACEABILITY Reference Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验 SPEC/TRACEABILITY 文件引用存在性（binance）
        run: bash .github/ci/binance-reference-integrity-check.sh

  # ── 10. Spec 状态报告 ───────────────────────────────────────
  spec-status-report:
    name: Spec Status Report
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 生成 spec 状态报告
        run: bash .github/ci/spec-status-report.sh

  # ── 11. 术语一致性检查 ──────────────────────────────────────
  glossary-consistency:
    name: Glossary Consistency
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检查术语与 GLOSSARY.md 一致性
        run: bash .github/ci/glossary-consistency.sh

  # ── 12. 反需求扫描 ─────────────────────────────────────────
  anti-requirement-scan:
    name: Anti-Requirement Scan
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 spec 代码片段违反反需求
        run: bash .github/ci/anti-requirement-scan.sh

  # ── 13. Outer Metrics 写入源守卫（宪法 §14.2） ──────────────
  # 禁止 LLM agent 修改 .omc/state/outer-metrics/；只允许 github-actions[bot]
  # 或带 [outer-metrics] 标记的提交。
  outer-metrics-guard:
    name: Outer Metrics Guard
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 outer-metrics 写入源合法性
        run: bash scripts/outer-metrics-validate.sh

  # ── 14. 部署控制面守卫 ──────────────────────────────────────
  # 业务仓库只能引用 ZoneCNH/sre 的发布入口；不得收纳 sre/ 源码
  # 或在 workflow 内写 inline 远程部署命令。
  deployment-policy:
    name: Deployment Policy
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验部署控制面边界
        run: bash .github/ci/deploy-policy-guard.sh

  # ── 15. CICD-001 门禁 (reusable) ─────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  # ── 16. xlibgate Runner Policy (dual verification) ────────────
  xlibgate-runner:
    needs: runner-gate
    name: xlibgate Runner Gates
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: xlibgate runner policy
        run: |
          if command -v xlibgate &>/dev/null; then
            xlibgate trust runner-policy --repo . || true
            xlibgate trust runner-pools --repo . || true
            xlibgate trust deploy-isolation --repo . || true
          else
            echo "xlibgate not installed — skipping dual verification"
          fi
        env:
          PATH: /home/workspace/xlibgate:${{ env.PATH }}

  # ── 17. Module-Pool Sync Check ─────────────────────────────────
  module-pool-sync:
    name: Module-Pool Sync (CICD-001)
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 校验 RUNNER-POOLS.yaml 与 registry.yaml 同步
        run: bash .github/ci/module-pool-sync-check.sh .
