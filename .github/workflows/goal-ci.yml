# Goal 驱动交付体系 CI/CD
# 权威来源：docs/goal/16-ci-cd.md
# 路径：.github/workflows/goal-ci.yml

name: Goal CI

on:
  push:
    branches: [main]
    paths:
      - '.config/goal/**'
      - 'docs/goal/**'
      - '.claude/agents/goal-*.md'
  pull_request:
    branches: [main]
    paths:
      - '.config/goal/**'
      - 'docs/goal/**'
      - '.claude/agents/goal-*.md'

jobs:
  # 1. YAML 语法检查
  yaml-lint:
    name: YAML Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .github/yamllint.yml .config/goal/**/*.yaml

  # 2. Registry 完整性检查
  registry-check:
    name: Registry Integrity
    runs-on: ubuntu-latest
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check Registry files exist
        run: |
          required_files=(
            ".config/goal/registry/goals.yaml"
            ".config/goal/registry/tasks.yaml"
            ".config/goal/registry/issues.yaml"
            ".config/goal/registry/releases.yaml"
            ".config/goal/registry/risks.yaml"
            ".config/goal/registry/decisions.yaml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Validate YAML structure
        run: |
          python3 -c "
          import yaml
          import sys

          files = [
              '.config/goal/registry/goals.yaml',
              '.config/goal/registry/tasks.yaml',
              '.config/goal/registry/issues.yaml',
              '.config/goal/registry/releases.yaml',
              '.config/goal/registry/risks.yaml',
              '.config/goal/registry/decisions.yaml',
              '.config/goal/matrix/matrix.yaml',
              '.config/goal/gates/state.yaml',
              '.config/goal/pipeline/state.yaml',
          ]

          for f in files:
              try:
                  with open(f) as fh:
                      data = yaml.safe_load(fh)
                  print(f'✅ {f}: valid YAML')
              except Exception as e:
                  print(f'❌ {f}: {e}')
                  sys.exit(1)
          "

  # 3. ID 格式检查
  id-format-check:
    name: ID Format Validation
    runs-on: ubuntu-latest
    needs: registry-check
    steps:
      - uses: actions/checkout@v4

      - name: Validate ID formats
        run: |
          python3 -c "
          import yaml
          import re

          # ID patterns
          patterns = {
              'goal_id': r'^GOAL-\d{8}-\d{3}$',
              'task_id': r'^TASK-GOAL-\d{8}-\d{3}-\d{3}$',
              'release_id': r'^REL-\d{8}-[\w-]+$',
              'risk_id': r'^RISK-GOAL-\d{8}-\d{3}-\d{3}$',
              'decision_id': r'^DEC-GOAL-\d{8}-\d{3}-\d{3}$',
          }

          # Check Goals
          with open('.config/goal/registry/goals.yaml') as f:
              data = yaml.safe_load(f)
              for goal in data.get('goals', []):
                  goal_id = goal.get('goal_id', '')
                  if not re.match(patterns['goal_id'], goal_id):
                      print(f'❌ Invalid goal_id: {goal_id}')
                      exit(1)
                  print(f'✅ Valid goal_id: {goal_id}')

          # Check Tasks
          with open('.config/goal/registry/tasks.yaml') as f:
              data = yaml.safe_load(f)
              for task in data.get('tasks', []):
                  task_id = task.get('task_id', '')
                  if not re.match(patterns['task_id'], task_id):
                      print(f'❌ Invalid task_id: {task_id}')
                      exit(1)
                  print(f'✅ Valid task_id: {task_id}')

          print('✅ All ID formats valid')
          "

  # 4. Matrix 覆盖率检查
  matrix-coverage:
    name: Matrix Coverage
    runs-on: ubuntu-latest
    needs: registry-check
    steps:
      - uses: actions/checkout@v4

      - name: Check Matrix coverage
        run: |
          python3 -c "
          import yaml

          # Load Matrix
          with open('.config/goal/matrix/matrix.yaml') as f:
              matrix = yaml.safe_load(f)

          entries = matrix.get('matrix', [])
          if not entries:
              print('⚠️ Matrix is empty')
              exit(0)

          # Calculate coverage
          total = len(entries)
          done = sum(1 for e in entries if e.get('status') == 'Done')
          coverage = (done / total * 100) if total > 0 else 0

          print(f'Matrix entries: {total}')
          print(f'Done entries: {done}')
          print(f'Coverage: {coverage:.1f}%')

          if coverage < 95:
              print(f'❌ Coverage {coverage:.1f}% below 95% threshold')
              exit(1)
          else:
              print(f'✅ Coverage {coverage:.1f}% meets threshold')
          "

  # 5. Gate 状态检查
  gate-check:
    name: Gate Status Validation
    runs-on: ubuntu-latest
    needs: registry-check
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gate states
        run: |
          python3 -c "
          import yaml

          with open('.config/goal/gates/state.yaml') as f:
              gates = yaml.safe_load(f)

          gate_list = gates.get('gates', [])
          required_gates = ['G0', 'G1', 'G2', 'G3', 'G4', 'G5', 'G6', 'G7', 'G8', 'G9', 'G10', 'G11']

          found_gates = [g['gate_id'] for g in gate_list]

          for gate in required_gates:
              if gate not in found_gates:
                  print(f'❌ Missing gate: {gate}')
                  exit(1)

              gate_data = next(g for g in gate_list if g['gate_id'] == gate)
              status = gate_data.get('status')

              if status not in ['PASS', 'PASS_WITH_RISK', 'PENDING']:
                  print(f'❌ Gate {gate} has invalid status: {status}')
                  exit(1)

              print(f'✅ Gate {gate}: {status}')
          "

  # 6. 孤儿检查
  orphan-check:
    name: Orphan Detection
    runs-on: ubuntu-latest
    needs: registry-check
    steps:
      - uses: actions/checkout@v4

      - name: Check for orphan tasks
        run: |
          python3 -c "
          import yaml

          # Load Goals
          with open('.config/goal/registry/goals.yaml') as f:
              goals_data = yaml.safe_load(f)
          goal_ids = {g['goal_id'] for g in goals_data.get('goals', [])}

          # Load Tasks
          with open('.config/goal/registry/tasks.yaml') as f:
              tasks_data = yaml.safe_load(f)
          tasks = tasks_data.get('tasks', [])

          # Check orphan tasks
          orphan_tasks = []
          for task in tasks:
              goal_id = task.get('goal_id')
              if goal_id not in goal_ids:
                  orphan_tasks.append(task['task_id'])

          if orphan_tasks:
              print(f'❌ Found {len(orphan_tasks)} orphan tasks:')
              for t in orphan_tasks:
                  print(f'  - {t}')
              exit(1)
          else:
              print(f'✅ No orphan tasks found')
          "

  # 7. Agent 文件检查
  agent-check:
    name: Agent Files Validation
    runs-on: ubuntu-latest
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check Agent files exist
        run: |
          required_agents=(
            ".claude/agents/goal-spec.md"
            ".claude/agents/goal-reviewer.md"
            ".claude/agents/goal-matrix.md"
            ".claude/agents/goal-prompt-builder.md"
            ".claude/agents/goal-evidence.md"
          )

          for agent in "${required_agents[@]}"; do
            if [ ! -f "$agent" ]; then
              echo "❌ Missing: $agent"
              exit 1
            fi
            echo "✅ Found: $agent"
          done

      - name: Validate Agent frontmatter
        run: |
          for agent in .claude/agents/goal-*.md; do
            if head -1 "$agent" | grep -q "^---"; then
              echo "✅ $agent: has frontmatter"
            else
              echo "❌ $agent: missing frontmatter"
              exit 1
            fi
          done

  # 8. 文档一致性检查
  docs-check:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation updates
        run: |
          # Check if docs reference .config/goal/
          if grep -q "统一配置中心" docs/goal/README.md; then
            echo "✅ docs/goal/README.md: references .config/goal/"
          else
            echo "❌ docs/goal/README.md: missing .config/goal/ reference"
            exit 1
          fi

          if grep -q "统一状态路径" docs/goal/15-registry.md; then
            echo "✅ docs/goal/15-registry.md: references .config/goal/"
          else
            echo "❌ docs/goal/15-registry.md: missing .config/goal/ reference"
            exit 1
          fi

          if grep -q "Goal 驱动交付体系" AGENTS.md; then
            echo "✅ AGENTS.md: references Goal system"
          else
            echo "❌ AGENTS.md: missing Goal system reference"
            exit 1
          fi

  # 9. 完整性汇总
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - yaml-lint
      - registry-check
      - id-format-check
      - matrix-coverage
      - gate-check
      - orphan-check
      - agent-check
      - docs-check
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Goal CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Lint | ${{ needs.yaml-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ needs.registry-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ID Format | ${{ needs.id-format-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Matrix Coverage | ${{ needs.matrix-coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate Status | ${{ needs.gate-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orphan Check | ${{ needs.orphan-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Files | ${{ needs.agent-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
