# Goal 驱动交付体系 CI/CD
# 权威来源：docs/goal/16-ci-cd.md
# 路径：.github/workflows/goal-ci.yml

name: Goal CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.config/goal/**'
      - 'docs/goal/**'
      - 'docs/report/goal-*'
      - '.claude/agents/goal-*.md'
      - '.codex/agents/goal-*'
      - '.copilot/agents/goal-*'
      - 'AGENTS.md'
      - '.github/workflows/goal-ci.yml'
      - '.github/workflows/release.yml'
      - '.github/ci/goal-release-gate.sh'
      - '.github/ci/generate-release-manifest.sh'
  pull_request:
    branches: [main]
    paths:
      - '.config/goal/**'
      - 'docs/goal/**'
      - 'docs/report/goal-*'
      - '.claude/agents/goal-*.md'
      - '.codex/agents/goal-*'
      - '.copilot/agents/goal-*'
      - 'AGENTS.md'
      - '.github/workflows/goal-ci.yml'
      - '.github/workflows/release.yml'
      - '.github/ci/goal-release-gate.sh'
      - '.github/ci/generate-release-manifest.sh'

jobs:
  # 1. YAML 语法检查
  yaml-lint:
    name: YAML Syntax Check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .github/yamllint.yml .config/goal/**/*.yaml

  # 2. Registry 完整性检查
  registry-check:
    name: Registry Integrity
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check Registry files exist
        run: |
          required_files=(
            ".config/goal/registry/goals.yaml"
            ".config/goal/registry/tasks.yaml"
            ".config/goal/registry/issues.yaml"
            ".config/goal/registry/releases.yaml"
            ".config/goal/registry/risks.yaml"
            ".config/goal/registry/decisions.yaml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Validate YAML structure
        run: |
          python3 -c "
          import yaml
          import sys

          files = [
              '.config/goal/registry/goals.yaml',
              '.config/goal/registry/tasks.yaml',
              '.config/goal/registry/issues.yaml',
              '.config/goal/registry/releases.yaml',
              '.config/goal/registry/risks.yaml',
              '.config/goal/registry/decisions.yaml',
              '.config/goal/matrix/matrix.yaml',
              '.config/goal/gates/state.yaml',
              '.config/goal/pipeline/state.yaml',
              '.config/goal/schema/rules.yaml',
          ]

          for f in files:
              try:
                  with open(f) as fh:
                      data = yaml.safe_load(fh)
                  print(f'✅ {f}: valid YAML')
              except Exception as e:
                  print(f'❌ {f}: {e}')
                  sys.exit(1)
          "

  # 3. 规则漂移检查
  rule-drift-check:
    name: Rule Drift Check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: registry-check
    steps:
      - uses: actions/checkout@v4

      - name: Validate rule source consistency
        run: |
          python3 docs/goal/tools/rule-drift-check.py --root .

  # 4. Goal 控制面一致性验证
  goal-validator:
    name: Goal Control-Plane Validation
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: rule-drift-check
    steps:
      - uses: actions/checkout@v4

      - name: Validate Goal control-plane invariants
        run: |
          python3 docs/goal/tools/goal-validate.py --root . --mode strict --format text

  # 5. 统一 Goal 工具链检查
  goal-toolchain-check:
    name: Unified Goal Toolchain Check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: goal-validator
    steps:
      - uses: actions/checkout@v4

      - name: Run unified Goal workflow gate
        run: |
          bash docs/goal/tools/goal-workflow.sh gate --root . --mode strict --format text

  # 6. Agent 文件检查
  agent-check:
    name: Agent Files Validation
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check Agent files exist
        run: |
          required_agents=(
            ".claude/agents/goal-spec.md"
            ".claude/agents/goal-reviewer.md"
            ".claude/agents/goal-matrix.md"
            ".claude/agents/goal-prompt-builder.md"
            ".claude/agents/goal-evidence.md"
          )

          for agent in "${required_agents[@]}"; do
            if [ ! -f "$agent" ]; then
              echo "❌ Missing: $agent"
              exit 1
            fi
            echo "✅ Found: $agent"
          done

      - name: Validate Agent frontmatter
        run: |
          for agent in .claude/agents/goal-*.md; do
            if head -1 "$agent" | grep -q "^---"; then
              echo "✅ $agent: has frontmatter"
            else
              echo "❌ $agent: missing frontmatter"
              exit 1
            fi
          done

  # 10. 文档一致性检查
  docs-check:
    name: Documentation Consistency
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs: yaml-lint
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation updates
        run: |
          # Check if docs reference .config/goal/
          if grep -q "统一配置中心" docs/goal/README.md; then
            echo "✅ docs/goal/README.md: references .config/goal/"
          else
            echo "❌ docs/goal/README.md: missing .config/goal/ reference"
            exit 1
          fi

          if grep -q "统一状态路径" docs/goal/15-registry.md; then
            echo "✅ docs/goal/15-registry.md: references .config/goal/"
          else
            echo "❌ docs/goal/15-registry.md: missing .config/goal/ reference"
            exit 1
          fi

          if grep -q "Goal 驱动交付体系" AGENTS.md; then
            echo "✅ AGENTS.md: references Goal system"
          else
            echo "❌ AGENTS.md: missing Goal system reference"
            exit 1
          fi

  # 8. 完整性汇总
  summary:
    name: CI Summary
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs:
      - yaml-lint
      - registry-check
      - rule-drift-check
      - goal-validator
      - goal-toolchain-check
      - agent-check
      - docs-check
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Goal CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Lint | ${{ needs.yaml-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ needs.registry-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rule Drift | ${{ needs.rule-drift-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Goal Validator | ${{ needs['goal-validator'].result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Goal Toolchain Gate | ${{ needs['goal-toolchain-check'].result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Files | ${{ needs.agent-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
