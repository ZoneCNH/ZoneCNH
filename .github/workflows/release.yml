# 发布工作流 — 版本标签推送时自动创建 GitHub Release
#
# 触发条件：推送 v* 格式的 tag
# 流程：docs-ci 质量门禁 → Goal CI → Goal release gate → 生成 release manifest + SRE 合同预检 → 创建 GitHub Release

name: Release

# Self-hosted runner recovered 2026-07-09 (knowledge/ci.md Phase 0). Migrated to sre/foundation-l0.
# 删除 tag push trigger 防止 queued 堆积。重装 runner 后恢复 push tags trigger。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 0. CICD-001 门禁 ───────────────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  # ── 1. 质量门禁：复用 docs-ci 全部检查 ─────────────────────────
  quality-gate:
    needs: runner-gate
    uses: ./.github/workflows/docs-ci.yml

  # ── 2. Goal 控制面 CI：复用 Goal CI 全部检查 ────────────────────
  goal-control-plane:
    uses: ./.github/workflows/goal-ci.yml

  # ── 3. Goal 发布硬阻断：未满足 G10/风险/证据合同不得发布 ─────────
  release-gate:
    name: Goal Release Gate
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 10
    needs:
      - quality-gate
      - goal-control-plane
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行 Goal release gate
        run: bash .github/ci/goal-release-gate.sh

      - name: 上传 Goal release gate 产物
        uses: actions/upload-artifact@v4
        with:
          name: goal-release-gate
          path: release/manifest/goal-release-gate.json

  # ── 4. 生成 Release Manifest ──────────────────────────────────
  build-manifest:
    name: Build Release Manifest
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 15
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Goal release gate 产物
        uses: actions/download-artifact@v4
        with:
          name: goal-release-gate
          path: release/manifest/

      - name: 生成 release manifest
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_TARGET: homepage
          DEPLOY_TARGET_POOL: sre/governance
        run: bash .github/ci/generate-release-manifest.sh

      - name: 校验 SRE deploy contract
        env:
          REQUIRE_DEPLOY_EVIDENCE: "1"
        run: bash .github/ci/deploy-contract-preflight.sh

      - name: 生成 runner evidence（CICD-001）
        run: bash .github/ci/runner-evidence.sh release/evidence/runner-evidence.json

      - name: 上传 manifest 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/manifest/

  # ── 5. 创建 GitHub Release ────────────────────────────────────
  publish-release:
    name: Publish Release
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    timeout-minutes: 10
    needs: build-manifest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 manifest 产物
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release/manifest/

      - name: 生成 release notes
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${TAG}$" | tail -1)
          NOTES_FILE="release/manifest/release-notes.md"

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            PREV_LABEL="初始版本"
          else
            RANGE="${PREV_TAG}..${TAG}"
            PREV_LABEL="$PREV_TAG"
          fi

          {
            echo "## FoundationX 文档枢纽 ${TAG}"
            echo
            echo "## 从 ${PREV_LABEL} 到 ${TAG}"
            echo
            echo "### 📊 系统快照"
            jq -r '
              "组件总数: \(.stats.total_components) | 已有: \(.stats.existing) | 已创建: \(.stats.planned)\n平均进度: \(.stats.average_progress)% | 有版本号: \(.stats.versioned)"
            ' release/manifest/release-manifest.json
            echo
            echo "### ✨ 新功能"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true
            echo
            echo "### 🐛 修复"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true
            echo
            echo "### 📝 文档"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^docs" 2>/dev/null || true
            echo
            echo "### 🔧 其他"
            git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^docs" 2>/dev/null || true
            echo
            echo "---"
            echo "📎 完整 manifest 见附件"
          } > "$NOTES_FILE"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # 笔记文件路径与「生成 release notes」步骤写入的路径保持一致。
          # 注意：上一步的 shell 局部变量不会跨 step 传递，必须在此显式定义。
          NOTES_FILE="release/manifest/release-notes.md"
          NOTES_BODY=$(jq -Rs . < "${NOTES_FILE}")

          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"FoundationX ${TAG}\",\"body\":${NOTES_BODY}}")
          RELEASE_ID=$(echo "$RESPONSE" | jq '.id')

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=release-manifest.json" \
            --data-binary @release/manifest/release-manifest.json
