# 发布工作流 — 版本标签推送时自动创建 GitHub Release
#
# 触发条件：推送 v* 格式的 tag
# 流程：docs-ci 质量门禁 → Goal CI → Goal release gate → 生成 release manifest + SRE 合同预检 → 创建 GitHub Release

name: Release

# NOTE: self-hosted runner 已下线（zone-runner unregistered 2026-06-18），仅保留 workflow_dispatch 防止 queued 堆积。
# 删除 tag push trigger 防止 queued 堆积。重装 runner 后恢复 push tags trigger。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── 1. 质量门禁：复用 docs-ci 全部检查 ─────────────────────────
  quality-gate:
    uses: ./.github/workflows/docs-ci.yml

  # ── 2. Goal 控制面 CI：复用 Goal CI 全部检查 ────────────────────
  goal-control-plane:
    uses: ./.github/workflows/goal-ci.yml

  # ── 3. Goal 发布硬阻断：未满足 G10/风险/证据合同不得发布 ─────────
  release-gate:
    name: Goal Release Gate
    runs-on: [self-hosted, Linux, X64, homepage]
    timeout-minutes: 10
    needs:
      - quality-gate
      - goal-control-plane
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行 Goal release gate
        run: bash .github/ci/goal-release-gate.sh

      - name: 上传 Goal release gate 产物
        uses: actions/upload-artifact@v4
        with:
          name: goal-release-gate
          path: release/manifest/goal-release-gate.json

  # ── 4. 生成 Release Manifest ──────────────────────────────────
  build-manifest:
    name: Build Release Manifest
    runs-on: [self-hosted, Linux, X64, homepage]
    timeout-minutes: 15
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Goal release gate 产物
        uses: actions/download-artifact@v4
        with:
          name: goal-release-gate
          path: release/manifest/

      - name: 生成 release manifest
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_TARGET: homepage
          DEPLOY_TARGET_POOL: sre/homepage
        run: bash .github/ci/generate-release-manifest.sh

      - name: 校验 SRE deploy contract
        env:
          REQUIRE_DEPLOY_EVIDENCE: "1"
        run: bash .github/ci/deploy-contract-preflight.sh

      - name: 上传 manifest 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/manifest/

  # ── 5. 创建 GitHub Release ────────────────────────────────────
  publish-release:
    name: Publish Release
    runs-on: [self-hosted, Linux, X64, homepage]
    timeout-minutes: 10
    needs: build-manifest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 manifest 产物
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release/manifest/

      - name: 生成 changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            # 首个 tag，列出所有提交
            RANGE="HEAD"
            PREV_LABEL="初始版本"
          else
            RANGE="${PREV_TAG}..${TAG}"
            PREV_LABEL="$PREV_TAG"
          fi

          {
            echo "changes<<CHANGELOG_EOF"
            echo "## 从 ${PREV_LABEL} 到 ${TAG}"
            echo ""

            # 按 conventional commits 分类
            echo "### ✨ 新功能"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true
            echo ""
            echo "### 🐛 修复"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true
            echo ""
            echo "### 📝 文档"
            git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^docs" 2>/dev/null || true
            echo ""
            echo "### 🔧 其他"
            git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^docs" 2>/dev/null || true
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 读取 manifest 摘要
        id: manifest
        run: |
          if [ -f "release/manifest/release-manifest.json" ]; then
            SUMMARY=$(jq -r '
              "组件总数: \(.stats.total_components) | 已有: \(.stats.existing) | 已创建: \(.stats.planned)\n平均进度: \(.stats.average_progress)% | 有版本号: \(.stats.versioned)"
            ' release/manifest/release-manifest.json)
            {
              echo "summary<<SUMMARY_EOF"
              echo "$SUMMARY"
              echo "SUMMARY_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          BODY="## FoundationX 文档枢纽 ${TAG}"
          BODY+=$'\n\n'
          BODY+="### 📊 系统快照"
          BODY+=$'\n'
          BODY+="${{ steps.manifest.outputs.summary }}"
          BODY+=$'\n\n'
          BODY+="${{ steps.changelog.outputs.changes }}"
          BODY+=$'\n\n'
          BODY+="---"
          BODY+=$'\n'
          BODY+="📎 完整 manifest 见附件"

          gh release create "$TAG" \
            --title "FoundationX ${TAG}" \
            --notes "$BODY" \
            release/manifest/release-manifest.json
