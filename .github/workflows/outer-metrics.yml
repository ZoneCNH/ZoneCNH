# Outer Metrics CI — 评分体系的外部锚点采集与 Goodhart 检测
#
# 触发：合并到 main / 每日定时 / 手动
# 操作：
#   1. 对所有模块运行 git-based 指标采集
#   2. 计算 scorer 评分与真实质量的相关系数
#   3. 若触发 Goodhart 信号，自动开 Issue（不自动改 rubric）
#
# 宪法 §14.2 强制：本 workflow 是 outer-metrics 的合法写入源之一。
# LLM agent 在 PR 中修改 .omc/state/outer-metrics/ 将被 outer-metrics-validate.sh 阻断。

name: Outer Metrics

# Self-hosted runner decommissioned 2026-06-18. Migrated to ubuntu-latest.
# 删除 push/schedule 防止 queued 堆积。重装 runner 后恢复 push/schedule trigger。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect-and-evaluate:
    name: Collect & Evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于 git-based 指标

      - name: 采集每个模块的 git 指标
        id: collect
        run: |
          collected=0
          for module_dir in module/*/; do
            module=$(basename "$module_dir")
            [[ -f "$module_dir/SPEC.md" ]] || continue
            echo "── 采集 $module"
            if bash scripts/outer-metrics-from-git.sh "$module" HEAD~200; then
              collected=$((collected + 1))
            fi
          done
          echo "collected=$collected" >> "$GITHUB_OUTPUT"

      - name: 计算相关系数与 Goodhart 信号
        id: eval
        if: steps.collect.outputs.collected != '0'
        run: |
          bash scripts/outer-metrics-eval.sh | tee /tmp/eval.log
          if grep -q "触发宪法 §14.3" /tmp/eval.log; then
            echo "goodhart=true" >> "$GITHUB_OUTPUT"
            grep "冻结组件:" /tmp/eval.log >> "$GITHUB_OUTPUT" || true
          else
            echo "goodhart=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 outer-metrics PR
        if: steps.collect.outputs.collected != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          commit-message: |
            [outer-metrics] scheduled update via outer-metrics-eval.sh

            Co-authored-by: outer-metrics-eval.sh <noreply@github.com>
          title: "[outer-metrics] 定时指标更新"
          body: |
            由 `.github/workflows/outer-metrics.yml` 自动生成的 outer-metrics 更新。

            - 数据来源：`scripts/outer-metrics-from-git.sh` + `scripts/outer-metrics-eval.sh`
            - 受宪法 §14.2 保护：本 PR 由 `github-actions[bot]` 签发，validate.sh 应放行。

            如 outer-metrics-guard 报错，请检查 commit message 是否含 `[outer-metrics]` 标记。
          branch: outer-metrics/auto-update
          delete-branch: true
          add-paths: |
            .omc/state/outer-metrics/**
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: 触发 RSI Issue（Goodhart 信号）
        if: steps.eval.outputs.goodhart == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Goodhart 信号触发\n\n` +
              `outer-metrics 检测到 scorer 评分与真实质量相关性低于宪法 §14.4 阈值。\n\n` +
              `请按宪法 §14.3 RSI 流程处理：\n` +
              `1. Fork 受影响的 rubric / agent 配置到新版本目录\n` +
              `2. 在至少 3 个模块上跑 A/B\n` +
              `3. 用 outer-metrics 评判，而非 scorer 自身\n` +
              `4. 提交 PR 由人类维护者审批\n\n` +
              `详细数据见 \`.omc/state/outer-metrics/correlation.json\`。`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[RSI] Goodhart 信号触发：评分体系需要审议",
              body: body,
              labels: ["rsi", "anti-goodhart", "constitution-14"]
            });

  validate-write-source:
    name: Validate write source (LLM block)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拒绝 LLM agent 写入 outer-metrics
        run: bash scripts/outer-metrics-validate.sh
