name: Runner Health

# CICD-001 Runner 健康监控 — 定时检查 self-hosted runner 在线状态与容量
# 触发：每 30 分钟 + 手动触发

on:
  schedule:
    - cron: "3,33 * * * *"  # 每 30 分钟（避免整点/半点）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  health-check:
    name: Runner Health Check
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 15
    outputs:
      total: ${{ steps.check.outputs.total }}
      online: ${{ steps.check.outputs.online }}
      offline: ${{ steps.check.outputs.offline }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Query GitHub for runner status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/runners"
          AUTH=(-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json")
          RUNNERS=$(curl -fsS "${AUTH[@]}" "$API" | jq '.runners')
          TOTAL=$(echo "$RUNNERS" | jq 'length')
          ONLINE=$(echo "$RUNNERS" | jq '[.[] | select(.status=="online")] | length')
          OFFLINE=$((TOTAL - ONLINE))

          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "online=${ONLINE}" >> $GITHUB_OUTPUT
          echo "offline=${OFFLINE}" >> $GITHUB_OUTPUT

          echo "=== Runner Status ==="
          echo "Total: ${TOTAL}, Online: ${ONLINE}, Offline: ${OFFLINE}"
          echo

          if [ "${OFFLINE}" -gt 0 ]; then
            echo "=== Offline Runners ==="
            echo "$RUNNERS" | jq -r '.[] | select(.status=="offline") | "  \(.name)\t\(.status)\t\(.labels | map(.name) | join(","))"'

            # Only create issue on schedule runs (not manual)
            if [ "${{ github.event_name }}" = "schedule" ]; then
              BODY=$(jq -n \
                --arg total "${TOTAL}" --arg online "${ONLINE}" --arg offline "${OFFLINE}" \
                --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                '{title: ("ci(health): " + ($offline | tostring) + " self-hosted runners offline"),
                  labels: ["ci","infra","p0"],
                  body: ("## Runner Health Alert\n\n\($offline) runner(s) are currently offline.\n\n| Metric | Value |\n|--------|-------|\n| Total runners | \($total) |\n| Online | \($online) |\n| Offline | \($offline) |\n\nRun: \($run_url)\n\nAction: SSH to affected hosts and check `systemctl status actions.runner.*`")}')
              curl -fsS "${AUTH[@]}" -X POST \
                "https://api.github.com/repos/${{ github.repository }}/issues" \
                -d "$BODY" 2>/dev/null || true
            fi
          else
            echo "All runners online ✓"
          fi

      - name: Record health evidence
        run: |
          mkdir -p release/evidence
          cat > release/evidence/runner-health.json <<JSON
          {
            "schema": "zonecnh.runner-health.v1",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_runners": ${{ steps.check.outputs.total }},
            "online": ${{ steps.check.outputs.online }},
            "offline": ${{ steps.check.outputs.offline }}
          }
          JSON

      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: runner-health-${{ github.run_id }}
          path: release/evidence/runner-health.json

  # ── 2. Pool Capacity ─────────────────────────────────────────
  pool-capacity:
    name: Pool Capacity Check
    needs: health-check
    runs-on: [self-hosted, Linux, X64, sre/governance]
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Check pool capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Pool Capacity ==="
          AUTH=(-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json")
          RUNNERS=$(curl -fsS "${AUTH[@]}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq '.runners[] | select(.status=="online")')

          # Group by pool label
          echo "$RUNNERS" | jq -r '.labels[] | select(.name | startswith("sre/")) | .name' | sort | uniq -c | while read count pool; do
            echo "  ${pool}: ${count} online"
          done

          echo
          echo "Summary: ${{ needs.health-check.outputs.online }} / ${{ needs.health-check.outputs.total }} runners online"
