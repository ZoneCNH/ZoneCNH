name: Runner Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 0. CICD-001 门禁 ───────────────────────────────────────
  runner-gate:
    uses: ./.github/workflows/runner-gate.yml

  test:
    needs: runner-gate
    runs-on: [self-hosted, Linux, X64, sre/foundation-l0]
    steps:
      - run: echo "runner works" && hostname && whoami && date
