# Scripts Tests — rule-scorer 单元测试与 shell 脚本健全性
#
# 触发：scripts/ 或 docs/governance/scoring/ 变更
# 防止规则引擎与仲裁协议漂移；同时锁定 outer-metrics 三个 shell 脚本可执行性。

name: Scripts Tests

# NOTE: self-hosted runner 已下线（zone-runner unregistered 2026-06-18），仅保留 workflow_dispatch 防止 queued 堆积。
# 重装 runner 后恢复 pull_request/push trigger。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rule-scorer-tests:
    name: rule-scorer pytest
    runs-on: [self-hosted, Linux, X64, homepage]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 运行 rule-scorer 单元测试
        run: pytest scripts/tests/ -v

  shell-smoke:
    name: shell 脚本烟雾测试
    runs-on: [self-hosted, Linux, X64, homepage]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: rule-scorer.py CLI smoke
        run: |
          # 选一个已存在的 spec 模块跑一次
          module=$(ls -d module/*/ 2>/dev/null | head -1 | xargs basename || echo "kernel")
          python3 scripts/rule-scorer.py spec "$module"

      - name: outer-metrics scripts smoke
        run: |
          bash scripts/outer-metrics-validate.sh
          bash scripts/outer-metrics-eval.sh
