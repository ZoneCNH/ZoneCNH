  # ========================================================================
  frontend:
    pool: sre/foundation-l1
  alertx:
    pool: sre/foundation-l1
  composer:
    pool: sre/foundation-l1

  # ========================================================================
  # 横切 — x.go 跨模块工具
  # ========================================================================
  x.go:
    pool: sre/foundation-l1

# ============================================================================
# 安全扫描（全局复用 sre/security pool）
# ============================================================================
security:
  pool: sre/security
  modules: all
  workflows:
    - gitleaks
    - govulncheck
    - sbom
    - supply-chain-scan
