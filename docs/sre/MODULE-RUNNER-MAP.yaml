# MODULE-RUNNER-MAP.yaml — ZoneCNH 模块 → Runner Pool 确定性映射
#
# 权威来源：knowledge/ci.md §7, BASELINE.yaml, module/registry.yaml
# 现状 2026-07-09：10.2.2.9 已恢复 sre/foundation-l0×2, sre/foundation-l1×2, sre/contracts×1, sre/security×1
#   sre/governance, sre/storage-light, sre/storage-heavy, sre/market, sre/macro, sre/engine, sre/deploy 待主机恢复。
# 使用方式：workflow 中 runs-on: [self-hosted, Linux, X64, <pool>]
# Pool 定义：docs/sre/RUNNER-POOLS.yaml

version: "2026.07.09"
default_pool: sre/foundation-l1

modules:
  # ========================================================================
  # 治理层（文档 / 基线 / 策略检查）
  # ========================================================================
  ZoneCNH:
    pool: sre/governance

  # ========================================================================
  # 基座 L0 原语（stdlib-only）
  # ========================================================================
  kernel:
    pool: sre/foundation-l0

  # ========================================================================
  # 基座 L1 运行时
  # ========================================================================
  configx:
    pool: sre/foundation-l1
  observex:
    pool: sre/foundation-l1
  resiliencx:
    pool: sre/foundation-l1
  schedulex:
    pool: sre/foundation-l1
  testkitx:
    pool: sre/foundation-l1
  bootstrap:
    pool: sre/foundation-l1

  # ========================================================================
  # 基座 标准源 / 证据 / 门禁
  # ========================================================================
  xlib_standard:
    pool: sre/governance
  xlib_harness:
    pool: sre/governance
  xlib_evidence:
    pool: sre/governance
  xlibgate:
    pool: sre/governance

  # ========================================================================
  # 基座 存储扩展
  # ========================================================================
  redisx:
    pool: sre/storage-light
  natsx:
    pool: sre/storage-light
  ossx:
    pool: sre/storage-light

  postgresx:
