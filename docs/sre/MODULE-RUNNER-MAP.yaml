  eastmoney:
    pool: sre/macro
  japan_cb:
    pool: sre/macro
  uk_cb:
    pool: sre/macro
  yield_curve:
    pool: sre/macro
  macro_data:
    pool: sre/macro
  pe_data:
    pool: sre/macro
  alternative_data:
    pool: sre/macro

  # ========================================================================
  # 分析域 — 因子 / 信号 / 特征 / 脑机
  # ========================================================================
  factor_engine:
    pool: sre/engine
  feature_store:
    pool: sre/engine
  factor_eval:
    pool: sre/engine
  market_regime:
    pool: sre/engine
  macro_regime:
