  # ========================================================================
  signal_factory:
    pool: sre/engine
  backtestx:
    pool: sre/engine
  backtest_engine:
    pool: sre/engine
  optimizer:
    pool: sre/engine
  strategyx:
    pool: sre/engine
  maestro:
    pool: sre/engine

  # ========================================================================
  # 执行域 — 风控 / 订单 / 持仓 / 结算
  # ========================================================================
  riskx:
    pool: sre/engine
  risk_engine:
    pool: sre/engine
  orderx:
    pool: sre/engine
  order_engine:
    pool: sre/engine
  positionx:
    pool: sre/engine
  portfolio_engine:
    pool: sre/engine
  settlement:
    pool: sre/engine

  # ========================================================================
