  domainx:
    pool: sre/contracts
  domain_market:
    pool: sre/contracts
  domain_macro:
    pool: sre/contracts
  domain_exchange:
    pool: sre/contracts

  # ========================================================================
  # 数据域 — 市场（交易所适配器 + 行情数据）
