      - host: 84.247.154.45
        pool: sre/deploy
        reason: 生产 secrets 隔离
      - host: 10.2.2.9
        pool: sre/security
        reason: 轻量安全扫描
  constraints:
  - GitHub user account：runner 按 repo 注册，不可 org 共享
  - sre/deploy 必须独立主机/进程，禁止与 PR runner 混池
  - storage-heavy 单 runner 独占 4 vCPU / 8 Gi，max_concurrency=1
  - 10.2.2.9 内存仅 16 Gi，不建议承载超过 12 个并发 runner
  - xhypers 同时作为工作站，runner 密度上限 40，避免影响交互使用
  risks:
  - 10.2.2.9 内存不足导致 OOM
  - 84.247.154.45 磁盘使用率 69%，Docker 与 _work 目录增长可能占满
  - xhypers 工作站与 runner 争用资源
  - 用户账号 PAT 权限不足影响批量注册
