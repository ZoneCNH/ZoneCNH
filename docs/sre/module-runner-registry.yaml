    phase_b_xhypers:
      host: 10.2.2.10
      hostname: xhypers
      cpu: 16
      memory_gb: 126
      disk_gb: 1900
      planned_runners: 37
      target_pools:
      - sre/engine
      - sre/macro
      - sre/storage-heavy
      gap_after: 2
    phase_c_final_tuning:
      planned_runners: 2
      note: 根据实际并发率与队列情况在 xhypers 或 10.2.2.9 上微调，最终达到 68 runner
  constraints:
  - GitHub user account：runner 按 repo 注册，不可 org 共享
  - sre/deploy 必须独立主机/进程，禁止与 PR runner 混池
  - storage-heavy 单 runner 独占 4 vCPU / 8 Gi，max_concurrency=1
  - 10.2.2.9 内存仅 16 Gi，不建议承载超过 12 个并发 runner
  - xhypers 同时作为工作站，runner 密度上限 40，避免影响交互使用
  risks:
  - 10.2.2.9 内存不足导致 OOM
  - 84.247.154.45 磁盘使用率 69%，Docker 与 _work 目录增长可能占满
  - xhypers 工作站与 runner 争用资源
  - 用户账号 PAT 权限不足影响批量注册
