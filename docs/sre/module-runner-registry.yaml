    phase_a_density:
      target_runners: 30
      gap_after: 38
      actions:
      - host: 94.72.124.39
        add: 2
        target_pools:
        - sre/governance
      - host: 10.2.2.9
        add: 6
        target_pools:
        - sre/foundation-l1
        - sre/contracts
        - sre/security
      - host: 84.247.154.45
