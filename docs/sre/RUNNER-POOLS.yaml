# RUNNER-POOLS.yaml — ZoneCNH Self-hosted Runner Pool 注册表
#
# 权威来源：knowledge/ci.md §6.2, CICD-001
# 现状 2026-07-10：全部 11 个 pool online，16 runners，3 hosts，Go 1.26.5
# 巡检入口：sre/bootstrap/status.sh, sre/bootstrap/health-check.sh
# 主机注册表 SSOT：sre/bootstrap/hosts.env
# 模块分配表：sre/module.md

version: "2026.07.10"
owner: ZoneCNH
policy: self_hosted_only

global:
  required_labels:
    - self-hosted
    - Linux
    - X64
  forbidden_github_hosted: true
  ephemeral_preferred: true
  persistent_runner_allowed_temporarily: true

pools:
  sre/governance:
    purpose: governance, docs, baseline, dependency matrix, policy check
    label: ci-governance
    allowed_events: [pull_request, push, workflow_dispatch, schedule]
    secrets: none
    docker: false
    production_access: false
    max_concurrency: 2
    host: 94.72.124.39
    status: online
    runner_count: 2
    note: 2026-07-09 恢复，Go 1.26.5
    modules:
      - xlib_standard   # standard source
      - xlib_harness    # harness
      - xlib_evidence   # evidence
      - xlibgate        # gate

  sre/foundation-l0:
    purpose: kernel, stdlib-only modules
    allowed_events: [pull_request, push, workflow_dispatch]
    secrets: none
    docker: false
    production_access: false
    max_concurrency: 2
    host: 10.2.2.9
    status: online
    runner_count: 2
    note: 2026-07-09 恢复，Go 1.26.5
    modules:
      - kernel          # L0 primitives

  sre/foundation-l1:
