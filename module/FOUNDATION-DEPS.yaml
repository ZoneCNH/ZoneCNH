# Foundation 依赖矩阵 — 机器可读
# CI 可直接消费此文件执行依赖守卫检查
# 与 FOUNDATION-V1.md Issue 2 对应

version: "1.0"
updated: "2026-06-07"

# ============================================================
# Go baseline
# ============================================================
go_baseline: "1.23"
go_baseline_note: >
  所有 Foundation 模块统一 Go 1.23。
  等全仓库 CI 确认后再统一升级到 1.24。
  testkitx 当前 go.mod 是 1.24，需要降级对齐。

# ============================================================
# 模块定义
# ============================================================
modules:
  kernel:
    path: github.com/ZoneCNH/kernel
    layer: L0
    stdlib_only: true
    description: "L0 原语底座，只使用 Go 标准库"

  configx:
    path: github.com/ZoneCNH/configx
    layer: L1
    stdlib_only: false
    description: "配置加载、合并、解码、校验、脱敏"

  observex:
    path: github.com/ZoneCNH/observex
    layer: L1
    stdlib_only: false
    description: "可观测性语义契约库"

  resiliencx:
    path: github.com/ZoneCNH/resiliencx
    layer: L1
    stdlib_only: false
    description: "弹性容错运行时库"

  schedulex:
    path: github.com/ZoneCNH/schedulex
    layer: L1
    stdlib_only: false
    description: "确定性调度器"

  testkitx:
    path: github.com/ZoneCNH/testkitx
    layer: L1
    stdlib_only: false
    description: "测试专用能力库，生产禁止 import"

# ============================================================
# 允许的依赖关系（单向箭头 = 调用方可以依赖被调方）
# ============================================================
allowed_deps:
  kernel:        []                                    # stdlib-only
  configx:       [kernel]                              # 显式配置契约，可使用 kernel 原语
  observex:      [kernel]                              # 只依赖 kernel
  resiliencx:    [kernel]                              # 观测通过本地接口或 adapter 接入
  schedulex:     [kernel]                              # 不直接依赖 resiliencx/observex
  testkitx:      [kernel, configx, observex, resiliencx, schedulex]  # 测试所有

# ============================================================
# 禁止的依赖（任何基础模块都不得导入）
# ============================================================
