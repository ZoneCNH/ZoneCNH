  xlib-standard: []                                    # 标准源，无运行时依赖
  xlib-harness:  []                                    # 工具运行器，无 Foundation 运行时依赖
  xlib-evidence: []                                    # evidence runtime，无 Foundation 运行时依赖
  xlibgate:      []                                    # 机器门禁，无运行时依赖
  redisx:        [kernel]                              # 只依赖 kernel 原语
  kafkax:        [kernel]                              # 只依赖 kernel 原语
  natsx:         [kernel]                              # 只依赖 kernel 原语
  postgresx:     [kernel]                              # 只依赖 kernel 原语
  taosx:         [kernel]                              # 只依赖 kernel 原语
  ossx:          [kernel]                              # 只依赖 kernel 原语
  clickhousex:   [kernel]                              # 只依赖 kernel 原语
  contracts:     []                                    # 跨域契约独立，无 Foundation 运行时依赖
  transportx:    [contracts, configx, observex, resiliencx]  # 传输契约可消费公开契约和横切接口
  domainx:       [kernel]                              # 领域共享原语只依赖 kernel

