# ============================================================
# 特殊约束
# ============================================================
constraints:
  kernel:
    - id: stdlib-only
      check: go list -m all | grep -v "^github.com/ZoneCNH/kernel" | grep -v "^std"
      fail_if: "任何非 stdlib 依赖存在"
      message: "kernel 只能使用 Go 标准库"

    - id: no-hidden-goroutine
      check: grep -rn "go func" --include="*.go" | grep -v "_test.go" | grep -v "internal/test"
      fail_if: "生产代码中有未文档化的 goroutine 启动"
      message: "kernel 不允许隐藏后台 goroutine"

  testkitx:
    - id: no-production-import
      check: |
        for pkg in $(go list ./...); do
          if [[ "$pkg" != *"testkitx"* ]] && [[ "$pkg" != *"test"* ]]; then
            if grep -rq "testkitx" <(go list -f '{{.Imports}}' "$pkg" 2>/dev/null); then
              echo "BLOCKED: $pkg imports testkitx"
              exit 1
            fi
          fi
        done
      fail_if: "生产包 import testkitx"
      message: "testkitx 只能在测试中使用"

  configx:
    - id: no-foundationx-new-usage
      check: grep -rn "foundationx" --include="*.go" | grep -v "_test.go" | grep -v "internal/foundationx"
      fail_if: "新增 foundationx 依赖"
      message: "不再新增 foundationx usage，走 ADR 退出计划"

  observex:
    - id: no-foundationx-new-usage
      check: grep -rn "foundationx" --include="*.go" | grep -v "_test.go"
      fail_if: "新增 foundationx 依赖"
      message: "不再新增 foundationx usage，走 ADR 退出计划"

  resiliencx:
    - id: no-hard-observex-core-import
      check: grep -rn "github.com/ZoneCNH/observex" --include="*.go" | grep -v "_test.go" | grep -v "/adapter"
      fail_if: "核心包硬 import observex"
      message: "resiliencx 核心只输出本地 policy event/observer 接口，observex 绑定放 adapter 或调用方"

  schedulex:
    - id: no-hard-observex-or-resiliencx-core-import
      check: grep -rnE "github.com/ZoneCNH/(observex|resiliencx)" --include="*.go" | grep -v "_test.go" | grep -v "/adapter"
      fail_if: "核心包硬 import observex 或 resiliencx"
      message: "schedulex 核心只声明 EventSink/Locker 接口，观测和弹性策略由调用方组合"

# ============================================================
# 允许但不形成 go.mod 边的接口集成
# ============================================================
interface_only_integrations:
  resiliencx:
    observex:
      mode: "interface-only"
      rule: "核心包可暴露本地 Observer/EventSink 回调输出 policy event；不得硬 import observex。"
    schedulex:
      mode: "caller-composition"
      rule: "调度任务需要弹性策略时，由 x.go 或调用方把 job handler 包进 resiliencx policy。"

  schedulex:
    observex:
      mode: "interface-only"
      rule: "核心包只声明 JobRunEvent/EventSink；观测记录由调用方或 adapter 完成。"

  x.go:
    foundation:
      mode: "composition-root"
      rule: "x.go 可以装配 configx、observex、resiliencx、schedulex 和业务模块；基础模块不得反向依赖 x.go。"

  transportx:
    adapters:
      mode: "adapter-implements-contract"
      rule: "kafkax/natsx/redisx 等具体传输实现可在 adapter 层实现 transportx 契约；transportx 不得反向依赖 broker/client 模块。"

# ============================================================
# 基础模块间禁止的依赖边
# ============================================================
forbidden_foundation_edges:
  - from: kernel
    to: [configx, observex, resiliencx, schedulex, testkitx, x.go, business]
    rule: "kernel 是 L0 原语层，只允许 Go 标准库依赖。"

  - from: configx
    to: [observex, resiliencx, schedulex, x.go, business]
    rule: "configx 只负责显式配置 source、decode、validate、redaction、provenance 和 manifest。"

  - from: observex
    to: [configx, resiliencx, schedulex, x.go, business]
    rule: "observex 只定义 vendor-neutral 观测契约，不读取配置、不调用策略、不理解业务。"

  - from: resiliencx
    to: [configx, observex, schedulex, x.go, business]
    rule: "resiliencx 是 operational resilience；观测只能通过本地接口或 adapter，不能硬依赖 observex。"

  - from: schedulex
    to: [configx, observex, resiliencx, x.go, business]
    rule: "schedulex 是 deterministic scheduler；重试/熔断由调用方组合，观测通过 EventSink 接口。"

  - from: production
    to: [testkitx]
    rule: "testkitx 只能 test-only 使用，不得进入生产 import graph。"

  # 标准源 / 门禁
  - from: xlib_standard
    to: [kernel, configx, observex, resiliencx, schedulex, testkitx, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, transportx, x.go, business]
    rule: "xlib_standard 是标准源，不 import 任何运行时模块。只通过脚本扫描/检查下游仓库。"

  - from: xlibgate
    to: [kernel, configx, observex, resiliencx, schedulex, testkitx, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, transportx, x.go, business]
    rule: "xlibgate 是机器门禁，不 import 任何运行时模块。只通过脚本扫描/检查下游仓库。"

  # 存储扩展
  - from: redisx
    to: [configx, resiliencx, schedulex, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, testkitx, x.go, business]
    rule: "redisx 只封装 Redis 客户端，不跨越存储引擎边界。允许依赖 observex 的 metric 常量与 NoopMetrics alias（统一跨组件指标名，非观测实现耦合）。"

  - from: kafkax
    to: [configx, resiliencx, schedulex, redisx, natsx, postgresx, taosx, ossx, clickhousex, contracts, testkitx, x.go, business]
    rule: "kafkax 只封装 Kafka 客户端，不跨越存储引擎边界。允许依赖 observex 的 metric 常量与 NoopMetrics alias（统一跨组件指标名，非观测实现耦合）。"

  - from: natsx
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, postgresx, taosx, ossx, clickhousex, contracts, testkitx, x.go, business]
    rule: "natsx 只封装 NATS 客户端，不跨越存储引擎边界。"

  - from: postgresx
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, taosx, ossx, clickhousex, contracts, testkitx, x.go, business]
    rule: "postgresx 只封装 PostgreSQL 客户端，不跨越存储引擎边界。"

  - from: taosx
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, ossx, clickhousex, contracts, testkitx, x.go, business]
    rule: "taosx 只封装 TDengine 客户端，不跨越存储引擎边界。"

  - from: ossx
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, taosx, clickhousex, contracts, testkitx, x.go, business]
    rule: "ossx 只封装对象存储客户端，不跨越存储引擎边界。"

  - from: clickhousex
    to: [configx, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, taosx, ossx, contracts, testkitx, x.go, business]
    rule: "clickhousex 只封装 ClickHouse 客户端，不跨越存储引擎边界。允许依赖 observex 的 metric 常量与 NoopMetrics alias（统一跨组件指标名，非观测实现耦合）。"

  # 契约
  - from: contracts
    to: [kernel, configx, observex, resiliencx, schedulex, testkitx, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, x.go, business]
    rule: "contracts 只定义跨域稳定接口，不依赖任何模块实现。"

  - from: transportx
    to: [schedulex, testkitx, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, x.go, business]
    rule: "transportx 只定义跨 runtime / adapter 传输契约；可依赖 contracts/configx/observex/resiliencx 的公开接口，但不得依赖具体 broker/client、存储实现、入口或业务域。"

  # L2.5 领域共享层
  - from: domain_market
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, transportx, testkitx, x.go, business]
    rule: "domain_market 是市场领域共享语义，只依赖 decimalx + domainx；不依赖基础设施或业务域。"

  - from: domain_macro
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, transportx, testkitx, x.go, business]
    rule: "domain_macro 是宏观领域共享语义，只依赖 decimalx + domainx；不依赖基础设施或业务域。"

  - from: domain_exchange
    to: [configx, observex, resiliencx, schedulex, redisx, kafkax, natsx, postgresx, taosx, ossx, clickhousex, contracts, transportx, testkitx, x.go, business]
    rule: "domain_exchange 是交易所 SPI，只依赖 decimalx + domainx + domain_market；不依赖基础设施或业务域。"

# ============================================================
