# Foundation 依赖矩阵 — 机器可读
# CI 可直接消费此文件执行依赖守卫检查
# 与 FOUNDATION-V1.md Issue 2 对应

version: "1.2"
updated: "2026-06-15"

# ============================================================
# Go baseline
# ============================================================
go_baseline: "1.23"
go_baseline_note: >
  所有 Foundation 模块统一 Go 1.23（含 testkitx，已于 2026-06-12 从 1.24 降级对齐）。
  等全仓库 CI 确认后再统一升级到 1.24。

# ============================================================
# 模块定义
# ============================================================
modules:
