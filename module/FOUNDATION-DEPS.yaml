    path: github.com/ZoneCNH/xlib-standard
    layer: standard-source
    stdlib_only: false
    runtime_dependency: false
    description: "标准事实源 / Go Reference Template / schema / template"

  xlib-harness:
    path: github.com/ZoneCNH/xlib-harness
    layer: harness
    stdlib_only: false
    runtime_dependency: false
    description: "generator/scaffold/spec-lint/boundary/traceability/format/template 门禁运行器"

  xlib-evidence:
    path: github.com/ZoneCNH/xlib-evidence
    layer: evidence
    stdlib_only: false
    runtime_dependency: false
    description: "CI/release evidence manifest 与 report runtime"

  xlibgate:
    path: github.com/ZoneCNH/xlibgate
    layer: gate
    stdlib_only: false
    runtime_dependency: false
    description: "import/gomod/baseline/release/repo-contract/reason_code/maturity claim 机器门禁"

  # 存储扩展（按需引入）
  redisx:
    path: github.com/ZoneCNH/redisx
    layer: storage
    stdlib_only: false
    description: "Redis 客户端封装"

  kafkax:
    path: github.com/ZoneCNH/kafkax
    layer: storage
    stdlib_only: false
    description: "Kafka 消息队列"

  natsx:
    path: github.com/ZoneCNH/natsx
    layer: storage
    stdlib_only: false
    description: "NATS 内部通信"

  postgresx:
    path: github.com/ZoneCNH/postgresx
    layer: storage
    stdlib_only: false
    description: "PostgreSQL 关系型存储"

  taosx:
    path: github.com/ZoneCNH/taosx
    layer: storage
    stdlib_only: false
    description: "TDengine 时序存储"

  ossx:
    path: github.com/ZoneCNH/ossx
    layer: storage
    stdlib_only: false
    description: "Aliyun OSS 对象存储"

  clickhousex:
    path: github.com/ZoneCNH/clickhousex
    layer: storage
    stdlib_only: false
    description: "ClickHouse OLAP"

  # 契约
  contracts:
    path: github.com/ZoneCNH/contracts
    layer: contracts
    stdlib_only: false
    description: "跨域稳定端口、事件协议、DTO"

  transportx:
    path: github.com/ZoneCNH/transportx
    layer: contracts
    stdlib_only: false
    description: "跨 runtime / adapter 传输契约"

  domainx:
    path: github.com/ZoneCNH/domainx
    layer: L2.5
    stdlib_only: false
    description: "领域共享基础契约与原语"

# ============================================================
