# Foundation 依赖矩阵 — 机器可读
# CI 可直接消费此文件执行依赖守卫检查
# 与 FOUNDATION-V1.md Issue 2 对应
# modules.*.path 是 Go module identity（import path），与
# module/registry.yaml repo 的 GitHub 托管身份分离；转移仓库不自动改写本字段。

version: "1.3.1"
updated: "2026-07-09"

# ============================================================
# Go baseline
# ============================================================
go_baseline: "1.23"
go_baseline_note: >
  所有 Foundation 模块统一 Go 1.23（含 testkitx，已于 2026-06-12 从 1.24 降级对齐）。
  等全仓库 CI 确认后再统一升级到 1.24。

# ============================================================
# 模块定义
# ============================================================
modules:
  kernel:
    path: github.com/ZoneCNH/kernel
    layer: L0
    stdlib_only: true
    description: "L0 原语底座，只使用 Go 标准库"

  configx:
    path: github.com/ZoneCNH/configx
    layer: L1
    stdlib_only: false
    description: "配置加载、合并、解码、校验、脱敏"

  observex:
    path: github.com/ZoneCNH/observex
    layer: L1
    stdlib_only: false
    description: "可观测性语义契约库"

  resiliencx:
    path: github.com/ZoneCNH/resiliencx
    layer: L1
    stdlib_only: false
    description: "弹性容错运行时库"

  schedulex:
    path: github.com/ZoneCNH/schedulex
    layer: L1
    stdlib_only: false
    description: "确定性调度器"

  testkitx:
    path: github.com/ZoneCNH/testkitx
    layer: L1
    stdlib_only: false
    description: "测试专用能力库，生产禁止 import"

  bootstrap:
    path: github.com/ZoneCNH/bootstrap
    layer: L1
    stdlib_only: false
    description: "L1 Assembly 通用进程组装层：位于 L1 primitives 之上、x.go 入口之下，统一组装 configx/observex/lifecycx/resiliencx 与可选存储适配器"

  # 标准源 / 门禁（不参与运行时依赖）
  xlib_standard:
    path: github.com/ZoneCNH/xlib_standard
    layer: standard-source
    stdlib_only: false
    runtime_dependency: false
    description: "标准事实源 / Go Reference Template / schema / template"

  xlib_harness:
    path: github.com/ZoneCNH/xlib_harness
    layer: harness
    stdlib_only: false
    runtime_dependency: false
    description: "generator/scaffold/spec-lint/boundary/traceability/format/template 门禁运行器"

  xlib_evidence:
    path: github.com/ZoneCNH/xlib_evidence
    layer: evidence
    stdlib_only: false
    runtime_dependency: false
    description: "CI/release evidence manifest 与 report runtime"

  xlibgate:
    path: github.com/ZoneCNH/xlibgate
    layer: gate
    stdlib_only: false
    runtime_dependency: false
    description: "import/gomod/baseline/release/repo-contract/reason_code/maturity claim/projection drift/blocker-aware factory gate 机器门禁"

  # 存储扩展（按需引入）
  redisx:
    path: github.com/ZoneCNH/redisx
    layer: storage
    stdlib_only: false
    description: "Redis 客户端封装"

  kafkax:
    path: github.com/ZoneCNH/kafkax
    layer: storage
    stdlib_only: false
    description: "Kafka 消息队列"

  natsx:
    path: github.com/ZoneCNH/natsx
    layer: storage
    stdlib_only: false
    description: "NATS 内部通信"

  postgresx:
    path: github.com/ZoneCNH/postgresx
    layer: storage
    stdlib_only: false
    description: "PostgreSQL 关系型存储"

  taosx:
    path: github.com/ZoneCNH/taosx
    layer: storage
    stdlib_only: false
    description: "TDengine 时序存储"

  ossx:
    path: github.com/ZoneCNH/ossx
    layer: storage
    stdlib_only: false
    description: "Aliyun OSS 对象存储"

  clickhousex:
    path: github.com/ZoneCNH/clickhousex
    layer: storage
    stdlib_only: false
    description: "ClickHouse OLAP"

  # 契约
  contracts:
    path: github.com/ZoneCNH/contracts
    layer: contracts
    stdlib_only: false
    description: "跨域稳定端口、事件协议、DTO"

  transportx:
    path: github.com/ZoneCNH/transportx
    layer: contracts
    stdlib_only: false
    shared_module: xlib_standard
    description: "跨 runtime / adapter 传输契约"

  domainx:
    path: github.com/ZoneCNH/domainx
    layer: L2.5
    stdlib_only: false
    description: "领域共享基础契约与原语"

  decimalx:
    path: github.com/ZoneCNH/decimalx
    layer: L2.5
    stdlib_only: true
    description: "高精度十进制运算原语（纯 stdlib）"

  domain_market:
    path: github.com/ZoneCNH/domain_market
    layer: L2.5
    stdlib_only: false
    description: "市场领域共享语义：ProductLine/InstrumentKey/MarketFactEnvelope + Tick/Quote/Bar/OrderBook"

  domain_macro:
    path: github.com/ZoneCNH/domain_macro
    layer: L2.5
    stdlib_only: false
    description: "宏观领域共享语义：MacroPoint/MacroInformationSet/no-lookahead"

  domain_exchange:
    path: github.com/ZoneCNH/domain_exchange
    layer: L2.5
    stdlib_only: false
    description: "交易所 SPI：VenueCapability/RateLimitPolicy/ExchangeError"

# ============================================================
# 允许的依赖关系（单向箭头 = 调用方可以依赖被调方）
# ============================================================
allowed_deps:
  kernel:        []                                    # stdlib-only
  configx:       [kernel]                              # 显式配置契约，可使用 kernel 原语
  observex:      [kernel]                              # 只依赖 kernel
  resiliencx:    [kernel]                              # 观测通过本地接口或 adapter 接入
  schedulex:     [kernel]                              # 不直接依赖 resiliencx/observex
  testkitx:      [kernel, configx, observex, resiliencx, schedulex]  # 测试所有
  bootstrap:     [kernel, configx, observex, resiliencx, taosx, postgresx, redisx, kafkax, natsx, ossx, clickhousex, foundationx]  # L1 Assembly 特例：只做组装，可依赖 L0/L1 primitives 与受控 L2 adapter；禁止 L2.5/业务域/x.go；foundationx 为间接依赖
  xlib_standard: []                                    # 标准源，无运行时依赖
  xlib_harness:  []                                    # 工具运行器，无 Foundation 运行时依赖
  xlib_evidence: []                                    # evidence runtime，无 Foundation 运行时依赖
  xlibgate:      []                                    # 机器门禁，无运行时依赖
  redisx:        [kernel, observex]                   # kernel 原语 + observex 观测接口
  kafkax:        [kernel, observex]                   # kernel 原语 + observex 观测接口
  natsx:         [kernel]                              # 只依赖 kernel 原语
  postgresx:     [kernel]                              # 只依赖 kernel 原语
  taosx:         [kernel]                              # 只依赖 kernel 原语
  ossx:          [kernel]                              # 只依赖 kernel 原语
  clickhousex:   [kernel, observex]                   # kernel 原语 + observex 观测接口
  contracts:     []                                    # 跨域契约独立，无 Foundation 运行时依赖
  transportx:    [contracts, configx, observex, resiliencx, xlib_standard]  # 传输契约可消费公开契约和横切接口；xlib_standard 为标准源依赖
  domainx:       [kernel, decimalx]                     # 领域共享原语依赖 kernel 原语 + decimalx 高精度运算
  decimalx:      []                                    # 纯 stdlib，无 Foundation 运行时依赖
  domain_market: [decimalx, domainx]                    # 市场语义依赖 decimalx 高精度 + domainx 共享原语
  domain_macro:  [decimalx, domainx]                    # 宏观语义依赖 decimalx 高精度 + domainx 共享原语
  domain_exchange: [decimalx, domainx, domain_market]   # 交易所 SPI 依赖 decimalx + domainx + 市场语义
  alertx:        [observex, contracts]                # 横切告警消费者：单向依赖 observex 导出 + contracts 契约（ADR-001 D1）

