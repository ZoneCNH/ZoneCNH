    stdlib_only: true
    description: "L0 原语底座，只使用 Go 标准库"

  configx:
    path: github.com/ZoneCNH/configx
    layer: L1
    stdlib_only: false
    description: "配置加载、合并、解码、校验、脱敏"

  observex:
    path: github.com/ZoneCNH/observex
    layer: L1
    stdlib_only: false
    description: "可观测性语义契约库"

  resiliencx:
    path: github.com/ZoneCNH/resiliencx
    layer: L1
    stdlib_only: false
    description: "弹性容错运行时库"

  schedulex:
    path: github.com/ZoneCNH/schedulex
    layer: L1
    stdlib_only: false
    description: "确定性调度器"

  testkitx:
    path: github.com/ZoneCNH/testkitx
    layer: L1
    stdlib_only: false
    description: "测试专用能力库，生产禁止 import"

  # 标准源 / 门禁（不参与运行时依赖）
