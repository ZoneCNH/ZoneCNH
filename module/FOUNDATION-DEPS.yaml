# ============================================================
# 特殊约束
# ============================================================
constraints:
  kernel:
    - id: stdlib-only
      check: go list -m all | grep -v "^github.com/ZoneCNH/kernel" | grep -v "^std"
      fail_if: "任何非 stdlib 依赖存在"
      message: "kernel 只能使用 Go 标准库"

    - id: no-hidden-goroutine
      check: grep -rn "go func" --include="*.go" | grep -v "_test.go" | grep -v "internal/test"
      fail_if: "生产代码中有未文档化的 goroutine 启动"
      message: "kernel 不允许隐藏后台 goroutine"

  testkitx:
    - id: no-production-import
      check: |
        for pkg in $(go list ./...); do
          if [[ "$pkg" != *"testkitx"* ]] && [[ "$pkg" != *"test"* ]]; then
            if grep -rq "testkitx" <(go list -f '{{.Imports}}' "$pkg" 2>/dev/null); then
              echo "BLOCKED: $pkg imports testkitx"
              exit 1
            fi
          fi
        done
      fail_if: "生产包 import testkitx"
      message: "testkitx 只能在测试中使用"

  configx:
    - id: no-foundationx-new-usage
      check: grep -rn "foundationx" --include="*.go" | grep -v "_test.go" | grep -v "internal/foundationx"
      fail_if: "新增 foundationx 依赖"
      message: "不再新增 foundationx usage，走 ADR 退出计划"

  observex:
    - id: no-foundationx-new-usage
      check: grep -rn "foundationx" --include="*.go" | grep -v "_test.go"
      fail_if: "新增 foundationx 依赖"
      message: "不再新增 foundationx usage，走 ADR 退出计划"

  resiliencx:
    - id: no-hard-observex-core-import
      check: grep -rn "github.com/ZoneCNH/observex" --include="*.go" | grep -v "_test.go" | grep -v "/adapter"
      fail_if: "核心包硬 import observex"
      message: "resiliencx 核心只输出本地 policy event/observer 接口，observex 绑定放 adapter 或调用方"

  schedulex:
    - id: no-hard-observex-or-resiliencx-core-import
      check: grep -rnE "github.com/ZoneCNH/(observex|resiliencx)" --include="*.go" | grep -v "_test.go" | grep -v "/adapter"
      fail_if: "核心包硬 import observex 或 resiliencx"
      message: "schedulex 核心只声明 EventSink/Locker 接口，观测和弹性策略由调用方组合"

# ============================================================
# 允许但不形成 go.mod 边的接口集成
# ============================================================
interface_only_integrations:
  resiliencx:
    observex:
      mode: "interface-only"
      rule: "核心包可暴露本地 Observer/EventSink 回调输出 policy event；不得硬 import observex。"
    schedulex:
      mode: "caller-composition"
      rule: "调度任务需要弹性策略时，由 x.go 或调用方把 job handler 包进 resiliencx policy。"

  schedulex:
    observex:
      mode: "interface-only"
      rule: "核心包只声明 JobRunEvent/EventSink；观测记录由调用方或 adapter 完成。"

  x.go:
    foundation:
      mode: "composition-root"
      rule: "x.go 可以装配 configx、observex、resiliencx、schedulex 和业务模块；基础模块不得反向依赖 x.go。"

# ============================================================
# 基础模块间禁止的依赖边
# ============================================================
forbidden_foundation_edges:
  - from: kernel
    to: [configx, observex, resiliencx, schedulex, testkitx, x.go, business]
    rule: "kernel 是 L0 原语层，只允许 Go 标准库依赖。"

  - from: configx
    to: [observex, resiliencx, schedulex, x.go, business]
    rule: "configx 只负责显式配置 source、decode、validate、redaction、provenance 和 manifest。"

  - from: observex
    to: [configx, resiliencx, schedulex, x.go, business]
    rule: "observex 只定义 vendor-neutral 观测契约，不读取配置、不调用策略、不理解业务。"

  - from: resiliencx
    to: [configx, observex, schedulex, x.go, business]
    rule: "resiliencx 是 operational resilience；观测只能通过本地接口或 adapter，不能硬依赖 observex。"

  - from: schedulex
    to: [configx, observex, resiliencx, x.go, business]
    rule: "schedulex 是 deterministic scheduler；重试/熔断由调用方组合，观测通过 EventSink 接口。"

  - from: production
    to: [testkitx]
    rule: "testkitx 只能 test-only 使用，不得进入生产 import graph。"

# ============================================================
# foundationx compatibility（待退出）
# ============================================================
foundationx_compatibility:
  status: "transitional"
  adr: "module/ADR-foundationx-exit.md"
  current_usage:
    configx:
      version: "v0.0.0"
      replace: "./internal/foundationx"
      note: "本地 replace，非远程依赖"
    observex:
      version: "v0.1.0"
      note: "远程依赖，需迁移"
  deadline: "configx v0.3 / observex v0.4"
  migration_target: "kernel 原语 + 本地显式契约"
