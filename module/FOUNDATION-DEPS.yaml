# 业务域间允许依赖（单向 = 调用方可依赖被调方）
# 来源：03-boundaries.md §域间关系（line 19-23）
# 业务域 → 基座/L2.5/contracts 隐含允许（单向下行），不在此登记
business_allowed_deps:
  # 数据域 → 分析域：单向，原始数据和标准化行情进入因子计算（03-boundaries line 19）
  factor_engine: [market_data, macro_data, pe_data]
  feature_store: [market_data, macro_data]
  factor_eval: [factor_engine, feature_store]
  # 分析域 ↔ 决策域：因子驱动信号；回测反馈（line 20）
  signal_factory: [factor_engine, feature_store, factor_eval]
  strategyx: [signal_factory]
  backtestx: [factor_engine, feature_store, signal_factory, strategyx]
  optimizer: [backtestx, strategyx]
  factor_engine_cross: []  # placeholder: factor_eval 反馈到 factor_engine/feature_store 经 contracts 事件，非直接依赖
  # 决策域 → 执行域：信号必须先经 riskx（line 21, 35）
  riskx: [signal_factory, strategyx]  # riskx 消费 signal/strategy 意图做风控
  orderx: [riskx]                     # orderx 接收 riskx 放行的执行意图
  positionx: [orderx]
  settlement: [orderx, positionx]
  # 执行域 → 决策域：仅通过 fills/positions/PnL/exposure 事件（line 22, 36），非同步调用
  # （事件经 contracts 固化，不计入 go.mod 依赖；见 business_forbidden_edges）

# 业务域间禁止依赖（执行力待 Phase F：xlibgate 扩展 FoundationDeps struct + scanImports）
# 来源：03-boundaries.md §依赖守卫表（line 34-36）
business_forbidden_edges:
  # 守卫：业务域互相导入实现包，尤其执行域反向导入决策域（line 34）
  # 执行域禁止同步调用决策域内部实现（line 36，事件反馈除外）
  riskx: [backtestx, optimizer, maestro]
  orderx: [signal_factory, backtestx, optimizer, strategyx, maestro]
  positionx: [signal_factory, backtestx, optimizer, strategyx, maestro]
  settlement: [signal_factory, backtestx, optimizer, strategyx, maestro]
  # 守卫：决策到执行必须经 riskx，禁止绕过 riskx 直接调用 orderx（line 35）
  signal_factory: [orderx, positionx, settlement]
  optimizer: [orderx, positionx, settlement]
  strategyx: [orderx, positionx, settlement]
  # 守卫：数据域不依赖分析/决策/执行域（line 34，数据域是上游）
  binance: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  orderbook: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  okx: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  hyperliquid: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  coinglass: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  fred: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  treasury: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  market_data: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  macro_data: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  pe_data: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  alternative_data: [factor_engine, feature_store, factor_eval, signal_factory, strategyx, riskx, orderx, positionx]
  # 守卫：composer 只做组装，不做业务计算（line 23, 39）
  # composer 允许依赖各域 wiring，但禁止业务逻辑；此处不登记业务实现包禁止边（由架构审查把关）

# ============================================================
# Trust hardening rules (xlibgate v1.1.2)
# ============================================================
trust_hardening:
  version: "v1.1.2"
  fact_sources:
    status_index: ".foundationx/status/index.json"
    blockers: ".foundationx/blockers.json"
    repo_contract: ".foundationx/repo-contract.json"
    release_manifest_template: "release/manifest/template.json"
  projection_paths:
    - "STATUS.md"
    - "README.md"
    - "ARCHITECTURE.md"
    - "module/README.md"
    - "release/manifest/template.json"
  stable_reason_codes:
    factory_gate_blocked: "FACTORY_GATE_BLOCKED"
    contract_parse_error: "CONTRACT_PARSE_ERROR"
  exit_codes:
    pass: 0
    fail: 1
    error: 2
  rules:
    - id: projection-drift
      check: "public projections and release manifest trust evidence must match FoundationX fact sources"
      fail_if: "public docs, release/factory claims, open blockers, or projection_guard values drift from .foundationx facts"
      reason_code: "FACTORY_GATE_BLOCKED"
      exit_code: 1
    - id: release-false-blocks-factory
      check: "release=false implies factory=false"
      fail_if: "module status has release=false while factory=true"
      reason_code: "FACTORY_GATE_BLOCKED"
      exit_code: 1
    - id: open-blocker-blocks-factory
      check: "open blocker implies factory=false"
      fail_if: "module has an open blocker while factory=true"
      reason_code: "FACTORY_GATE_BLOCKED"
      exit_code: 1
    - id: audit-status-not-factory-proof
      check: "audit-status remains a projection consistency guard"
      fail_if: "audit-status pass is documented or emitted as factory-grade proof"
      reason_code: "FACTORY_GATE_BLOCKED"
      exit_code: 1
  invariants:
    - "Preserve exit code semantics: 0=pass, 1=fail, 2=error."
    - "Keep reason_code values stable for CI and release evidence consumers."
    - "Malformed or missing fact sources remain CONTRACT_PARSE_ERROR with exit code 2."
    - "Factory-grade claims require release evidence, blocker review, projection guard, and xlibgate trust evidence."

