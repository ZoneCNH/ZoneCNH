# CI/CD Workflow 参考模板 — fred
#
# 将此文件复制到 github.com/ZoneCNH/fred/.github/workflows/ci.yml
# CI 与 CD 必须使用 sre/ 机器池；禁止回退 GitHub-hosted runner。

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  SRE_CI_POOL: "sre/storage-light"
  SRE_DEPLOY_POOL: "sre/deploy"

jobs:
  preflight:
    name: Preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify machine pool
        run: |
          case "${{ env.SRE_CI_POOL }}" in
            sre/*) ;;
            *) echo "CI must run on sre/* pool"; exit 1 ;;
          esac
      - name: Download modules
        run: go mod download

  build:
    name: Build
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...

  test:
    name: Unit Test
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./... -race -count=1

  lint:
    name: Lint
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...

  boundary:
    name: Boundary Gates
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
      - name: Run boundary gates
        run: bash scripts/boundary-gates.sh

  integration:
    name: Integration
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration suite
        run: |
          go test ./internal/integration/... -run NATSIngestHandoff -count=1
          go test ./internal/integration/... -run MsBrainContract -count=1

  secret-scan:
    name: Secret Scan
    needs: preflight
    runs-on: [self-hosted, Linux, X64, sre/storage-light]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  release-preflight:
    name: Release Preflight
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint, boundary, integration, secret-scan]
    runs-on: [self-hosted, Linux, X64, sre/deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify deploy pool
        run: |
          case "${{ env.SRE_DEPLOY_POOL }}" in
            sre/*) ;;
            *) echo "CD must run on sre/* pool"; exit 1 ;;
          esac
      - name: Re-run critical checks
        run: |
          go test ./... -race -count=1
          bash scripts/boundary-gates.sh
