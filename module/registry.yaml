# module/registry.yaml — 统一模块注册表
#
# 这是模块身份与治理状态的单一 SSOT（Single Source of Truth）。
# 管辖：repo / local_path / domain / layer / arch_type / lifecycle / owner / spec_ref / registered
# 不管辖（引用其他 SSOT）：
#   - 依赖矩阵 → module/FOUNDATION-DEPS.yaml（deps_ref）
#   - 成熟度事实（version/release/factory）→ .foundationx/status/index.json（maturity_ref）
#
# Schema 定义：docs/governance/module-governance/01-module-registry.md
# 治理总纲：docs/governance/MODULE-GOVERNANCE.md
#
# 字段性质：
#   - 治理事实：repo, local_path, domain, layer, arch_type, lifecycle, owner, registered
#   - 引用：spec_ref, deps_ref, maturity_ref
#   - 投影：spec_version（mirror from SPEC.md Metadata），release 块（mirror from GitHub Release / .foundationx/status）
#
# 强制级别：本文件字段变更须遵循 01-module-registry.md §4 登记变更规则。

schema_version: module-registry/v1
updated: 2026-07-05

