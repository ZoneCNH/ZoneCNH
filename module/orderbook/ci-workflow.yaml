# CI/CD Workflow projection -- orderbook
#
# Runtime target:
# https://github.com/ZoneCNH/orderbook/.github/workflows/ci.yml
#
# This file is the ZoneCNH governance-side CI/CD contract projection for the
# orderbook runtime repository. Runtime implementation remains in
# github.com/ZoneCNH/orderbook.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: "Optional tag/ref for rollback drill"
        required: false
        type: string

permissions:
  contents: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  SRE_CI_POOL: "sre/market"
  SRE_DEPLOY_POOL: "sre/deploy"
  EVIDENCE_DIR: "release/evidence"

jobs:
  ci-preflight:
    name: CI Preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify module metadata
        run: |
          test -f go.mod
          go env GOMOD
          go version

  build:
    name: Build
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all packages
        run: GOWORK=off go build ./...

  test:
    name: Unit And Race Test
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Unit tests
        run: GOWORK=off go test ./...
      - name: Race tests
        run: GOWORK=off go test -race ./...

  lint:
    name: Lint
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go vet
        run: GOWORK=off go vet ./...

  boundary:
    name: Boundary And Replay Gates
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Boundary gate
        run: bash scripts/boundary-gates.sh
      - name: Adapter conformance gate
        run: bash scripts/adapter-conformance-gate.sh
      - name: Replay determinism gate
        run: bash scripts/replay-determinism-gate.sh
      - name: Gap injection gate
        run: bash scripts/gap-injection-gate.sh

  integration:
    name: Integration Test
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run package integration selectors
        run: GOWORK=off go test ./... -run Integration -count=1 -v

  secret-scan:
    name: Secret Scan
    needs: ci-preflight
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  evidence:
    name: Evidence Package
    needs: [build, test, lint, boundary, integration, secret-scan]
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create CI evidence manifest
        run: |
          mkdir -p "${{ env.EVIDENCE_DIR }}"
          cat > "${{ env.EVIDENCE_DIR }}/ci-manifest.json" <<'JSON'
          {
            "module": "orderbook",
            "ci_pool": "sre/market",
            "deploy_pool": "sre/deploy",
            "runner_namespace": "sre/",
            "contract": "orderbook replay/conformance library"
          }
          JSON
      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}/

  release-preflight:
    name: Release Preflight
    needs: evidence
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, sre/deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify release inputs
        run: |
          test -n "${GITHUB_REF}"
          git status --short

  release-publish:
    name: Release Publish
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, sre/deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md

  post-release-smoke:
    name: Post Release Smoke
    needs: release-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, sre/market]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Smoke released contract
        run: GOWORK=off go test ./pkg/conformance -count=1

  rollback-drill:
    name: Rollback Drill
    needs: post-release-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_ref != ''
    runs-on: [self-hosted, Linux, X64, sre/deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_ref }}
      - name: Verify rollback ref
        run: |
          git rev-parse --verify HEAD
          git status --short
