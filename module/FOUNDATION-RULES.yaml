# Foundation 基座模块规则矩阵 — 机器可读
# CI / xlibgate / 文档投影可直接消费此文件
# 与 FOUNDATION-DEPS.yaml(管"依赖")分工:本文件管"行为/安全/身份/CI 门禁"规则

version: "1.0.0"
updated: "2026-06-18"
ssot_note: >
  本文件是 19 基座模块行为/安全/身份/CI 门禁规则的机器可读 SSOT。
  依赖方向规则(allowed_deps/forbidden_deps/forbidden_foundation_edges)仍归 FOUNDATION-DEPS.yaml,
  本文件不重复这些规则,只通过 source 字段互引。
  FOUNDATION-DEPS.yaml 的 constraints 块(5 条规则)在本文件重新编码并真正可执行
  (原 constraints 块从未被任何 CI 消费,见 docs/governance/improvements/20260618-foundation-rules/SPEC.md)。
  每条规则的 evidence 字段标注执行者:非空 = machine-enforced(由该 CI 脚本/xlibgate 执行),
  空 = document-only(仅 SPEC/RULES.md 约束,待后续 task 接入机器门禁)。

# ============================================================
# 通用规则(所有基座模块必须满足)
# ============================================================
common_rules:
  - id: CO-001-go-baseline
    dimension: toolchain
    check: "go.mod 声明 go 版本 == 1.23"
    fail_condition: "go.mod 中 go 版本 != 1.23"
    reason_code: GO_BASELINE_MISMATCH
    exit_code: 1
    evidence: ".github/ci/foundation-deps-full-check.sh"
    source: "CONSTITUTION §3; FOUNDATION-DEPS.yaml go_baseline"

  - id: CO-002-no-business-import
    dimension: boundary
    check: "生产包不 import 任何业务域模块"
    fail_condition: "pkg/ 下 .go 文件 import github.com/ZoneCNH/{binance,okx,bybit,bitget,kucoin,gate,mexc,htx,coinbase,hyperliquid,lighter,upbit,coinglass,yield-curve,fred,treasury,bea,ecb,uk-cb,japan-cb,eastmoney,jin10,yahoo,alternative-data,factor-engine,feature-store,factor-eval,market_regime,macro_regime,regime-engine,ms_brain,flowx,signal-factory,backtest-engine,optimizer,backtestx,strategyx,maestro,risk-engine,riskx,order-engine,orderx,portfolio-engine,positionx,settlement,alertx}"
    reason_code: BUSINESS_IMPORT_IN_FOUNDATION
    exit_code: 1
    evidence: ".github/ci/foundation-boundary-check.sh"
    source: "FOUNDATION-DEPS.yaml forbidden_deps"

  - id: CO-003-no-xgo-reverse-dep
    dimension: boundary
    check: "基座不反向依赖 x.go 组合根"
    fail_condition: "基座模块 import github.com/ZoneCNH/x.go"
    reason_code: REVERSE_DEP_TO_COMPOSITION_ROOT
    exit_code: 1
    evidence: ".github/ci/foundation-boundary-check.sh"
    source: "FOUNDATION-DEPS.yaml forbidden_deps; CONSTITUTION §3"

  - id: CO-004-no-secret-in-metrics-label
    dimension: observability
    check: "metrics label 仅允许低基数非敏感字段(module/component/operation/status/error_kind)"
    fail_condition: "metrics label 含 order_id/user_id/account_id/api_key/secret/token/trace_id/symbol(未白名单)/exchange(未白名单)"
    reason_code: HIGH_CARDINALITY_OR_SENSITIVE_LABEL
    exit_code: 1
    evidence: ".github/ci/anti-requirement-scan.sh"
    source: "observex SPEC §7 BR; foundation-modules.md 观测输出策略"

  - id: CO-005-secret-redaction-leak-test
    dimension: security
    check: "日志/health/manifest/recorder 覆盖 secret 脱敏 leak test"
    fail_condition: "脱敏测试缺失或未覆盖日志/health/manifest 四处"
    reason_code: SECRET_REDACTION_LEAK_TEST_MISSING
    exit_code: 1
    evidence: ""
    source: "observex SPEC §18; configx SPEC §18 (document-only,待 FOLLOWUP-2)"

  - id: CO-006-no-log-fatal-in-library
    dimension: security
    check: "库代码不调用 log.Fatal / os.Exit / panic(除显式不可恢复初始化)"
    fail_condition: "pkg/ 下非 _test.go 文件含 log.Fatal|os.Exit|panic(无 //safe-exit 注释)"
    reason_code: LIBRARY_PROCESS_CONTROL_VIOLATION
    exit_code: 1
    evidence: ".github/ci/anti-requirement-scan.sh"
    source: "anti-requirements.md §2.2"

  - id: CO-007-no-unsafe
    dimension: security
    check: "不使用 unsafe 包"
    fail_condition: 'pkg/ 下 .go 文件 import "unsafe"'
    reason_code: UNSAFE_USAGE
    exit_code: 1
    evidence: ".github/ci/anti-requirement-scan.sh"
    source: "anti-requirements.md §2.2"

  - id: CO-008-no-hardcoded-secret
    dimension: security
    check: "源码无硬编码凭据"
    fail_condition: "源码含 AWS key / API key / password 等模式(gitleaks + grep-guard)"
    reason_code: HARDCODED_SECRET
    exit_code: 1
    evidence: ".github/ci/grep-guard.sh; xlibgate trust secret-redaction"
    source: "anti-requirements.md §2.4"

  - id: CO-009-no-hardcoded-address-port
    dimension: security
    check: "无硬编码地址端口"
    fail_condition: "源码含硬编码 127.0.0.1:6379 等本地地址端口"
    reason_code: HARDCODED_ADDRESS_PORT
    exit_code: 1
    evidence: ".github/ci/anti-requirement-scan.sh; .github/ci/grep-guard.sh"
    source: "anti-requirements.md §2.2"

  - id: CO-010-go-mod-tidy
    dimension: toolchain
    check: "go.mod 处于 tidy 状态"
    fail_condition: "go mod tidy 产生 diff"
    reason_code: GO_MOD_NOT_TIDY
    exit_code: 1
    evidence: ".github/ci/foundation-deps-full-check.sh; xlibgate check gomod"
    source: "xlibgate SPEC FR-003"

  - id: CO-011-module-identity-consistency
    dimension: identity
    check: "README H1 == go.mod module == repo name"
    fail_condition: "README H1 / go.mod module / GitHub repo name 三者不一致"
    reason_code: IDENTITY_MISMATCH
    exit_code: 1
    evidence: "xlibgate trust identity"
    source: "xlibgate SPEC FR-011; CONSTITUTION §2"

  - id: CO-012-release-evidence-required
    dimension: release
    check: "release 声明时须有完整 release evidence"
    fail_condition: "release=true 但 evidence 缺失或未通过"
    reason_code: RELEASE_EVIDENCE_MISSING
    exit_code: 1
    evidence: "xlibgate check release; xlibgate l2 release-check"
    source: "xlibgate SPEC FR-005; FOUNDATION-DEPS.yaml trust_hardening"

# ============================================================
# 逐模块规则(19 张规则卡)
# ============================================================
modules:
  kernel:
    layer: L0
    rules:
      - id: KERNEL-001-stdlib-only
        dimension: dependency
        check: "go list -deps 无非 stdlib 依赖"
        fail_condition: "任何非 stdlib 依赖存在"
        reason_code: KERNEL_NON_STDLIB
        exit_code: 1
        evidence: ".github/ci/foundation-boundary-check.sh"
        source: "FOUNDATION-DEPS.yaml constraints[stdlib-only]"

      - id: KERNEL-002-no-hidden-goroutine
        dimension: concurrency
        check: "生产代码无未文档化 goroutine"
        fail_condition: '生产 .go 文件含 "go func" 且无 //goroutine: 文档注释'
        reason_code: KERNEL_HIDDEN_GOROUTINE
        exit_code: 1
        evidence: ""
        source: "FOUNDATION-DEPS.yaml constraints[no-hidden-goroutine] (document-only,待 FOLLOWUP-2)"

      - id: KERNEL-003-no-global-mutable-singleton
        dimension: state
        check: "不持有包级全局可变单例"
        fail_condition: "包级 var 为 map/slice/mutex/*Client 且非 init-safe"
        reason_code: KERNEL_GLOBAL_MUTABLE_STATE
        exit_code: 1
        evidence: ""
        source: "kernel SPEC §7 BR; foundation-modules.md (document-only)"

      - id: KERNEL-004-retryx-is-l0-primitive-only
        dimension: boundary
        check: "retryx 仅含 backoff/retry marker/轻量 retry loop,不含完整 timeout/circuit/bulkhead"
        fail_condition: "kernel.retryx 出现 CircuitBreaker/Bulkhead/RateLimiter 类型"
        reason_code: KERNEL_RETRYX_SCOPE_CREEP
        exit_code: 1
        evidence: ""
        source: "kernel SPEC §7 BR; foundation-modules.md retryx 边界表 (document-only)"

      - id: KERNEL-005-obsx-is-minimal-interface
        dimension: boundary
        check: "obsx 仅是极简 no-vendor interface,不替代 observex"
        fail_condition: "kernel.obsx 引入 vendor SDK 或实现完整 logger/meter"
        reason_code: KERNEL_OBSX_SCOPE_CREEP
        exit_code: 1
        evidence: ""
        source: "kernel SPEC §7 BR (document-only)"

  configx:
    layer: L1
    rules:
      - id: CONFIGX-001-no-foundationx-new-usage
        dimension: freeze
        check: "不新增 foundationx import"
        fail_condition: "非 _test.go / 非 internal/foundationx 文件新增 github.com/.../foundationx import"
        reason_code: CONFIGX_FOUNDATIONX_REGRESSION
        exit_code: 1
        evidence: ""
        source: "FOUNDATION-DEPS.yaml constraints[no-foundationx-new-usage] (document-only,foundationx 已完全退出)"

      - id: CONFIGX-002-no-secret-backend
        dimension: boundary
        check: "核心包不直连 Vault/KMS/K8s Secret/云 Secret Manager"
        fail_condition: "pkg/configx 硬 import hashicorp/vault / cloud kms sdk"
        reason_code: CONFIGX_SECRET_BACKEND_BOUNDARY
        exit_code: 1
        evidence: ""
        source: "configx SPEC §5 Non-goals (document-only)"

      - id: CONFIGX-003-no-global-singleton
        dimension: state
        check: "不创建全局 Config 单例"
        fail_condition: "存在包级 var DefaultConfig / 全局 Config 实例"
        reason_code: CONFIGX_GLOBAL_SINGLETON
        exit_code: 1
        evidence: ""
        source: "configx SPEC §7 NoGlobalStateGate (document-only)"

      - id: CONFIGX-004-no-watch-reload-in-core
        dimension: boundary
        check: "核心包不在后台启动 watch/reload goroutine"
        fail_condition: "pkg/configx 非 reload 子包启动后台 goroutine"
        reason_code: CONFIGX_HIDDEN_WATCH_GOROUTINE
        exit_code: 1
        evidence: ""
        source: "configx SPEC §5 Non-goals (document-only)"

      - id: CONFIGX-005-provenance-mandatory
        dimension: test
        check: "provenance 是强制输出,非可选调试"
        fail_condition: "effective config 无 provenance 字段或测试缺失"
        reason_code: CONFIGX_PROVENANCE_NOT_MANDATORY
        exit_code: 1
        evidence: ""
        source: "configx SPEC §21 DoD (document-only)"

      - id: CONFIGX-006-stable-config-hash
        dimension: test
        check: "相同输入产生稳定 manifest hash"
        fail_condition: "相同输入两次加载 manifest hash 不一致"
        reason_code: CONFIGX_UNSTABLE_HASH
        exit_code: 1
        evidence: ""
        source: "configx SPEC §21 DoD (document-only)"

  observex:
    layer: L1
    rules:
      - id: OBSERVEX-001-no-foundationx-new-usage
        dimension: freeze
        check: "不新增 foundationx import"
        fail_condition: "非 _test.go 文件新增 github.com/.../foundationx import"
        reason_code: OBSERVEX_FOUNDATIONX_REGRESSION
        exit_code: 1
        evidence: ""
        source: "FOUNDATION-DEPS.yaml constraints[no-foundationx-new-usage] (document-only,foundationx 已完全退出)"

      - id: OBSERVEX-002-no-vendor-sdk-in-core
        dimension: boundary
        check: "核心包不硬绑定具体日志/指标/追踪供应商 SDK"
        fail_condition: "pkg/observex 硬 import zap/prometheus/otel 直接依赖"
        reason_code: OBSERVEX_VENDOR_LOCK_IN
        exit_code: 1
        evidence: ""
        source: "observex SPEC §5 Non-goals (document-only)"

      - id: OBSERVEX-003-no-config-read
        dimension: boundary
        check: "核心包不读取配置文件"
        fail_condition: "pkg/observex import configx 或直接读 YAML/ENV"
        reason_code: OBSERVEX_READS_CONFIG
        exit_code: 1
        evidence: ""
        source: "observex SPEC §5 Non-goals (document-only)"

      - id: OBSERVEX-004-no-global-client
        dimension: state
        check: "不创建全局 logger/meter/tracer"
        fail_condition: "存在包级全局 logger/meter/tracer 实例"
        reason_code: OBSERVEX_GLOBAL_CLIENT
        exit_code: 1
        evidence: ""
        source: "observex SPEC §5 Non-goals (document-only)"

      - id: OBSERVEX-005-label-policy-checker
        dimension: observability
        check: "label policy checker 拦截高基数和敏感 label"
        fail_condition: "无 label policy checker 或未拦截 order_id/api_key 等"
        reason_code: OBSERVEX_NO_LABEL_POLICY_CHECKER
        exit_code: 1
        evidence: ""
        source: "observex SPEC §21 DoD (document-only)"

      - id: OBSERVEX-006-noop-safe-without-injection
        dimension: test
        check: "noop 实现未注入时安全运行不 panic"
        fail_condition: "未注入 logger/meter/tracer 时 panic 或 nil deref"
        reason_code: OBSERVEX_NOOP_UNSAFE
        exit_code: 1
        evidence: ""
        source: "observex SPEC §21 DoD (document-only)"

  resiliencx:
    layer: L1
    rules:
      - id: RESILIENCX-001-no-hard-observex-core-import
        dimension: boundary
        check: "核心包不硬 import observex"
        fail_condition: "pkg/resiliencx 非 adapter 包 import github.com/ZoneCNH/observex"
        reason_code: RESILIENCX_HARD_OBSERVEX_IMPORT
        exit_code: 1
        evidence: ""
        source: "FOUNDATION-DEPS.yaml constraints[no-hard-observex-core-import] (document-only)"

      - id: RESILIENCX-002-identity-is-runtime-resilience
        dimension: identity
        check: "README/身份为 runtime resilience policy library,无 Standard Source/Generator/Harness 残留"
        fail_condition: 'README/docs 含 "Standard Source"|"Go Reference Template"|"Generator"|"Harness" 主身份叙事'
        reason_code: RESILIENCX_IDENTITY_REGRESSION
        exit_code: 1
        evidence: "xlibgate trust template-residue"
        source: "CONSTITUTION §1 P3; FOUNDATION-TRACKER Issue 1"

      - id: RESILIENCX-003-no-trading-risk
        dimension: boundary
        check: "不做交易风控/仓位控制/order risk decision"
        fail_condition: "出现 VaR/stopLoss/positionLimit/maxDrawdown 业务语义"
        reason_code: RESILIENCX_TRADING_RISK_SCOPE_CREEP
        exit_code: 1
        evidence: ""
        source: "CONSTITUTION §1 P3; foundation-modules.md (document-only)"

      - id: RESILIENCX-004-no-exchange-sdk-import
        dimension: boundary
        check: "不直接 import exchange SDK"
        fail_condition: "import 任何交易所 SDK"
        reason_code: RESILIENCX_EXCHANGE_SDK_IMPORT
        exit_code: 1
        evidence: ""
        source: "resiliencx SPEC §5 Non-goals (document-only)"

      - id: RESILIENCX-005-idempotency-guard
        dimension: concurrency
        check: "非幂等操作默认禁止自动 retry"
        fail_condition: "无 idempotency hint 或非幂等请求被 retry"
        reason_code: RESILIENCX_NON_IDEMPOTENT_RETRY
        exit_code: 1
        evidence: ""
        source: "resiliencx SPEC §7 BR (document-only)"

  schedulex:
    layer: L1
    rules:
      - id: SCHEDULEX-001-no-hard-observex-or-resiliencx-core-import
        dimension: boundary
        check: "核心包不硬 import observex 或 resiliencx"
        fail_condition: "pkg/schedulex 非 adapter 包 import github.com/ZoneCNH/(observex|resiliencx)"
        reason_code: SCHEDULEX_HARD_CROSS_IMPORT
        exit_code: 1
        evidence: ""
        source: "FOUNDATION-DEPS.yaml constraints[no-hard-observex-or-resiliencx-core-import] (document-only)"

      - id: SCHEDULEX-002-no-distributed-lock-impl
        dimension: boundary
        check: "不内置 Redis/Postgres 分布式锁实现"
        fail_condition: "pkg/schedulex 硬 import redis/postgres 客户端实现 Locker"
        reason_code: SCHEDULEX_EMBEDDED_LOCK_IMPL
        exit_code: 1
        evidence: ""
        source: "schedulex SPEC §5 Non-goals (document-only)"

      - id: SCHEDULEX-003-no-exactly-once-claim
