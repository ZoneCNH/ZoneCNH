        check: "timezone/DST golden test 防每日任务漂移"
        fail_condition: "无 DST golden test 或场景覆盖不全"
        reason_code: SCHEDULEX_NO_DST_GOLDEN
        exit_code: 1
        evidence: ""
        source: "schedulex SPEC §21 DoD (document-only)"

  testkitx:
    layer: L1-test
    rules:
      - id: TESTKITX-001-test-only-boundary
        dimension: boundary
        check: "生产包不 import testkitx"
