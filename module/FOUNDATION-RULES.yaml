      - id: TESTKITX-003-no-prod-env-read
        dimension: security
        check: "不读取真实生产环境变量或密钥"
        fail_condition: "testkitx 代码读取生产 ENV/密钥文件"
        reason_code: TESTKITX_PROD_ENV_READ
        exit_code: 1
        evidence: ""
        source: "testkitx SPEC §18 (document-only)"

      - id: TESTKITX-004-deterministic-no-flake
        dimension: test
        check: "测试路径 deterministic,避免 flake"
        fail_condition: "测试依赖时间/random/网络导致间歇失败"
        reason_code: TESTKITX_NON_DETERMINISTIC
        exit_code: 1
        evidence: ""
        source: "testkitx SPEC §17 (document-only)"

  bootstrap:
