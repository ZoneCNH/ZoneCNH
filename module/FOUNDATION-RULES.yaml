        check: "所有调度决策通过 clock 注入,可确定性测试"
        fail_condition: "调度逻辑直接用 time.Now 而非注入 clock"
        reason_code: SCHEDULEX_NO_CLOCK_INJECTION
        exit_code: 1
        evidence: ""
        source: "schedulex SPEC §7 BR (document-only)"

      - id: SCHEDULEX-005-dst-golden-test
