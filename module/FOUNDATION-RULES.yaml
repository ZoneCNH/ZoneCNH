dimensions:
  - dependency      # 依赖边界(谁可 import 谁)
  - boundary        # 进程/包/职责边界(如 testkitx 隔离、跨存储引擎)
  - concurrency     # 并发安全(context、goroutine、锁)
  - state           # 全局状态(单例、可变全局)
  - freeze          # 冻结(foundationx 退出、身份不回流)
  - observability   # 观测脱敏、低基数 label
  - security        # 密钥、输入校验、unsafe、进程控制
  - toolchain       # Go baseline、go mod tidy、lint
  - test            # 测试覆盖、contract、golden、deterministic
  - release         # 发布门禁、evidence、factory-grade
  - identity        # 模块身份(README H1、go.mod、职责不漂移)

# ============================================================
# 与现有门禁的关系(非冲突,明确分工)
# ============================================================
consumers:
  ci_scripts:
    - path: ".github/ci/foundation-boundary-check.sh"
      consumes: [CO-002, CO-003, "modules.*.rules.dimension=dependency|boundary"]
      note: "Python+PyYAML 解析,clone 真实源码做 import 扫描;读 FOUNDATION-DEPS.yaml 的 modules/allowed_deps/forbidden_deps/forbidden_foundation_edges"
    - path: ".github/ci/foundation-deps-full-check.sh"
      consumes: [CO-001, CO-010]
      note: "go.mod module 身份、Go baseline、Makefile boundary、check_secrets"
    - path: ".github/ci/anti-requirement-scan.sh"
      consumes: [CO-004, CO-006, CO-007, CO-009]
      note: "扫 SPEC 代码块的 anti-requirements 2.2-2.4"
    - path: ".github/ci/grep-guard.sh"
      consumes: [CO-008, CO-009]
      note: "敏感凭据、本地地址端口扫描"
    - path: "scripts/audit-status.py"
      consumes: [CO-012]
      note: "fact-layer guard,投影一致性"
  xlibgate:
    - command: "check imports / check all"
      consumes: [CO-002, CO-003, "modules.*.rules.dimension=dependency"]
      note: "Go yaml.v3 解析 FOUNDATION-DEPS.yaml;注意 boundary.go 的 source/targets vs from/to 漂移(FOLLOWUP-1)"
    - command: "check gomod"
      consumes: [CO-010]
    - command: "check baseline"
      consumes: [CO-001]
    - command: "check release / l2 release-check"
      consumes: [CO-012, "modules.*.rules.dimension=release"]
    - command: "trust identity"
      consumes: [CO-011, "modules.*.rules.dimension=identity"]
    - command: "trust template-residue"
      consumes: [RESILIENCX-002, XLIBSTANDARD-003]
    - command: "trust maturity --factory"
      consumes: [XLIBGATE-004, XLIBGATE-005, CO-012]
    - command: "trust testkit-prod-import"
      consumes: [TESTKITX-001]
    - command: "trust secret-redaction"
      consumes: [CO-008, XLIBEVIDENCE-003]
    - command: "trust fleet-status"
      consumes: [XLIBGATE-005]
  handoff_to_foundation_deps:
    note: >
      依赖方向规则(allowed_deps/forbidden_deps/forbidden_foundation_edges/go_baseline)仍归 FOUNDATION-DEPS.yaml。
      本文件只编码 FOUNDATION-DEPS.yaml 未覆盖或未执行(constraints 块)的行为/安全/身份/CI 门禁规则。
      两文件通过每条规则的 source 字段互引,不构成双 SSOT。
