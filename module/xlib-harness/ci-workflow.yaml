# Reference CI/CD projection for xlib-harness.
# The authoritative workflow files live in /home/xlib-harness/.github/workflows/.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public index
        run: |
          set -euo pipefail
          test -s README.md
          test -s FEATURES.md
          test -s ACCEPTANCE.md
          test -s .github/workflows/ci.yml
          grep -q "github.com/ZoneCNH/xlib-harness" README.md
          grep -q "module/xlib-harness/SPEC.md" README.md
          grep -q "module/xlib-harness/goal.md" README.md
          grep -q "module/xlib-harness/TRACEABILITY.md" README.md
          git diff --check

  go-validation:
    name: Go Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build, test, race, vet, coverage, and boundary gates
        run: make ci

  trust-alignment:
    name: Trust Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache: true
      - name: Install xlibgate
        run: go install github.com/ZoneCNH/xlibgate/cmd/xlibgate@v1.0.0
      - name: Trust alignment checks
        run: |
          set -euo pipefail
          XLIBGATE="$(go env GOPATH)/bin/xlibgate"
          GOWORK=off "$XLIBGATE" check imports -path .
          GOWORK=off "$XLIBGATE" check gomod -path .
          GOWORK=off "$XLIBGATE" check baseline -path . -expected 1.23

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache: false
      - name: Install gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" detect --source . --redact --verbose

---

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Validate release contract
        run: |
          set -euo pipefail
          test -s README.md
          test -s FEATURES.md
          test -s ACCEPTANCE.md
          test -s .github/workflows/ci.yml
          test -s .github/workflows/release.yml
          grep -q "github.com/ZoneCNH/xlib-harness" README.md
          grep -q "module/xlib-harness/SPEC.md" README.md
          grep -q "module/xlib-harness/goal.md" README.md
          grep -q "module/xlib-harness/TRACEABILITY.md" README.md
          git diff --check
      - name: Build, test, race, vet, coverage, and boundary gates
        run: make ci
      - name: Install xlibgate
        run: go install github.com/ZoneCNH/xlibgate/cmd/xlibgate@v1.0.0
      - name: Trust alignment checks
        run: |
          set -euo pipefail
          XLIBGATE="$(go env GOPATH)/bin/xlibgate"
          GOWORK=off "$XLIBGATE" check imports -path .
          GOWORK=off "$XLIBGATE" check gomod -path .
          GOWORK=off "$XLIBGATE" check baseline -path . -expected 1.23
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --latest \
              --draft=false \
              --prerelease=false \
              --verify-tag
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease,tagName,url)"
          printf '%s\n' "${release_json}"
          printf '%s\n' "${release_json}" | jq -e --arg tag "${RELEASE_TAG}" '
            .tagName == $tag
            and .isDraft == false
            and .isPrerelease == false
            and (.url | length > 0)
          '
