authority_source:
- docs/goal/00-authority-map.md
- docs/goal/04-gates.md
policy:
  pass_with_risk:
    required_fields:
    - risk_id
    - risk_owner
    - risk_level
    - risk_reason
    - mitigation
    - due_at
    - review_gate
    - release_blocking
    - evidence_id
    allowed_gates:
    - G0
    - G1
    - G2
    - G3
    - G4
    - G5
    - G7
    - G8
    - G9
    - G11
    disallowed_gates:
    - G6
    - G10
    release_prohibition:
    - G10 不允许 PASS_WITH_RISK
    - 任一 Open/Escalated release_blocking 风险会阻塞 G10
    - G6 PASS_WITH_RISK 是无效状态
    - P0/P1、权限、数据、回滚、观测、Release Evidence 缺口必须 FAIL/BLOCKED
