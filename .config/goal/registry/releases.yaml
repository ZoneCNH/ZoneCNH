      - 验证完整工作流（Goal → Spec → Design → Plan → Tasks → Code → Test → Review → Release）

      技术亮点：
      - 统一状态路径：所有 Goal 相关状态存放在 .config/goal/
      - Agent 职责分工：5 个 Agent 各司其职，协作完成 Goal 管线
      - 追溯矩阵：Goal→Spec→AC→Task→Test→Evidence 全链路可追溯
      - Gate 体系：G0-G11 共 12 个质量门禁，确保交付质量

